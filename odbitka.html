<title>Odbitka</title>
<style>
  :root{
    --paper:#F7F6F2;
    --ink:#1A1A1E;
    --grey:#6E736F;
    --hairline:#D9DAD4;
    --cyan:#00AEEF;
    --magenta:#EC008C;
    --yellow:#FFDE00;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:Georgia,'Times New Roman',serif;
    overflow:hidden;
  }
  #plate{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair}
  .margin{
    position:fixed;left:0;right:0;z-index:2;
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding:18px clamp(16px,5vw,44px);
    pointer-events:none;
  }
  .margin>*{pointer-events:auto}
  header.margin{top:0;flex-wrap:wrap;row-gap:10px}
  footer.margin{bottom:0;align-items:center}
  .mono{
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  }
  h1{
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    font-size:13px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;
  }
  .sub{font-style:italic;font-size:13px;color:var(--grey);pointer-events:none}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button,select{
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    background:transparent;color:var(--ink);
    border:1px solid var(--ink);border-radius:0;
    padding:7px 12px;cursor:pointer;
  }
  button:hover{background:var(--ink);color:var(--paper)}
  select:hover{border-color:var(--grey)}
  button:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  #status{color:var(--grey);font-variant-numeric:tabular-nums;pointer-events:none}
  #hint{font-style:italic;font-size:12px;color:var(--grey);pointer-events:none;text-align:center;flex:1}
  @media (max-width:640px){ #hint,.sub{display:none} }
</style>

<canvas id="plate" aria-label="Generatywna grafika: tusz płynący po papierze"></canvas>

<header class="margin">
  <div>
    <h1>Odbitka</h1>
    <div class="sub">generatywna pr&oacute;ba koloru</div>
  </div>
  <div class="controls">
    <select id="inkset" aria-label="Zestaw tusz&oacute;w">
      <option value="cmyk">CMYK</option>
      <option value="gall">Atrament &#380;elazowy</option>
      <option value="sang">Sangwina</option>
    </select>
    <button id="newBtn">Nowa p&#322;yta</button>
    <button id="pauseBtn">Wstrzymaj</button>
  </div>
</header>

<footer class="margin">
  <div class="mono" id="barSpace" style="min-width:120px">&nbsp;</div>
  <div id="hint">przeci&#261;gnij, by zawirowa&#263; tusz &middot; klikni&#281;cie stawia kropl&#281; &middot; N &mdash; nowa p&#322;yta &middot; spacja &mdash; pauza</div>
  <div class="mono" id="status">p&#322;yta &#8470; &mdash;</div>
</footer>

<script>
(function(){
  'use strict';
  var TAU = Math.PI*2;
  var canvas = document.getElementById('plate');
  var ctx = canvas.getContext('2d');
  var statusEl = document.getElementById('status');
  var pauseBtn = document.getElementById('pauseBtn');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var INKSETS = {
    cmyk: [
      {c:'0,174,239',  a:.060, w:1.05, p:.30},   // cyjan
      {c:'236,0,140',  a:.055, w:1.00, p:.27},   // magenta
      {c:'255,222,0',  a:.085, w:1.60, p:.25},   // żółty
      {c:'26,26,30',   a:.045, w:0.75, p:.18}    // czerń
    ],
    gall: [
      {c:'38,62,110',  a:.055, w:1.00, p:.62},
      {c:'20,22,26',   a:.045, w:0.75, p:.38}
    ],
    sang: [
      {c:'181,68,42',  a:.060, w:1.10, p:.58},
      {c:'96,66,40',   a:.050, w:0.85, p:.42}
    ]
  };

  var W=0, H=0, plate={x:0,y:0,w:0,h:0};
  var seed=0, plateNo=100+Math.floor(Math.random()*880);
  var particles=[], frame=0, paused=false, done=false;
  var FULL=2600, FADE=400, N_PART=1400, SUBSTEPS=2, SPEED=1.15;
  var inks=INKSETS.cmyk;
  var mouse={x:-1e4,y:-1e4,drag:false,on:false};

  function hash2(ix,iy,s){
    var n=(ix*374761393 + iy*668265263 + s*1013904223)|0;
    n=Math.imul(n^(n>>>13),1274126177); n^=n>>>16;
    return (n>>>0)/4294967295;
  }
  function vnoise(x,y,s){
    var ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy;
    var sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy);
    var a=hash2(ix,iy,s), b=hash2(ix+1,iy,s), c=hash2(ix,iy+1,s), d=hash2(ix+1,iy+1,s);
    return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;
  }
  function fieldAngle(x,y){
    var s=0.0016;
    var n=vnoise(x*s,y*s,seed)*0.65 + vnoise(x*s*2.7+31.7,y*s*2.7+11.3,seed^40503)*0.35;
    return n*TAU*2.6;
  }

  function pickInk(){
    var r=Math.random(), acc=0;
    for(var i=0;i<inks.length;i++){ acc+=inks[i].p; if(r<acc) return i; }
    return inks.length-1;
  }
  function spawn(p,x,y){
    p.x = x!==undefined ? x : plate.x+Math.random()*plate.w;
    p.y = y!==undefined ? y : plate.y+Math.random()*plate.h;
    p.life = 120+Math.random()*260;
    p.ink = pickInk();
  }

  function fit(){
    var dpr = Math.min(devicePixelRatio||1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var side = W<640?16:44;
    var head = document.querySelector('header').offsetHeight;
    var foot = document.querySelector('footer').offsetHeight;
    plate = {x:side, y:head+16, w:W-side*2, h:H-head-foot-32};
  }

  function furniture(){
    // krawędź płyty
    ctx.strokeStyle='#DDDED8'; ctx.lineWidth=1;
    ctx.strokeRect(plate.x+.5, plate.y+.5, plate.w-1, plate.h-1);
    // pasery w narożach
    ctx.strokeStyle='#B4B6AF';
    [[plate.x,plate.y],[plate.x+plate.w,plate.y],[plate.x,plate.y+plate.h],[plate.x+plate.w,plate.y+plate.h]]
    .forEach(function(pt){
      var x=pt[0], y=pt[1];
      ctx.beginPath(); ctx.arc(x,y,6,0,TAU); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x-10,y); ctx.lineTo(x+10,y);
      ctx.moveTo(x,y-10); ctx.lineTo(x,y+10);
      ctx.stroke();
    });
    // pasek kontrolny koloru w dolnym marginesie
    var sw=12, gap=4, bx=plate.x, by=plate.y+plate.h+9;
    var swatches = inks.length===4
      ? ['#00AEEF','#EC008C','#FFDE00','#1A1A1E','#1B4FA0','#00A651','#ED1C24','#3B3B33']
      : inks.map(function(k){return 'rgb('+k.c+')';});
    swatches.forEach(function(ccol,i){
      ctx.fillStyle=ccol;
      ctx.fillRect(bx+i*(sw+gap), by, sw, sw);
    });
    // ziarno papieru
    ctx.fillStyle='rgba(26,26,30,0.03)';
    for(var i=0;i<2200;i++){
      ctx.fillRect(plate.x+Math.random()*plate.w, plate.y+Math.random()*plate.h, 1, 1);
    }
  }

  function newPlate(keepSeed){
    if(!keepSeed){ seed=(Math.random()*1e9)|0; plateNo++; }
    frame=0; done=false;
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    ctx.fillStyle='#F7F6F2';
    ctx.fillRect(0,0,W,H);
    furniture();
    particles=[];
    for(var i=0;i<N_PART;i++){ var p={}; spawn(p); particles.push(p); }
    updateStatus();
  }

  function simFrame(){
    frame++;
    var ramp = frame<=FULL ? 1 : Math.max(0, 1-(frame-FULL)/FADE);
    if(ramp<=0){ done=true; updateStatus(); return; }
    ctx.save();
    ctx.beginPath();
    ctx.rect(plate.x,plate.y,plate.w,plate.h);
    ctx.clip();
    ctx.globalCompositeOperation='multiply';
    ctx.lineCap='round';
    for(var s=0;s<SUBSTEPS;s++){
      var paths=inks.map(function(){return new Path2D();});
      for(var i=0;i<particles.length;i++){
        var p=particles[i];
        var a=fieldAngle(p.x,p.y);
        if(mouse.on){
          var dx=p.x-mouse.x, dy=p.y-mouse.y;
          var r=mouse.drag?150:110, d2=dx*dx+dy*dy;
          if(d2<r*r){ a += (1-Math.sqrt(d2)/r)*(mouse.drag?2.2:1.0); }
        }
        var nx=p.x+Math.cos(a)*SPEED, ny=p.y+Math.sin(a)*SPEED;
        paths[p.ink].moveTo(p.x,p.y);
        paths[p.ink].lineTo(nx,ny);
        p.x=nx; p.y=ny; p.life--;
        if(p.life<=0 || nx<plate.x-6||nx>plate.x+plate.w+6||ny<plate.y-6||ny>plate.y+plate.h+6){
          spawn(p);
        }
      }
      for(var k=0;k<inks.length;k++){
        ctx.strokeStyle='rgba('+inks[k].c+','+(inks[k].a*ramp)+')';
        ctx.lineWidth=inks[k].w;
        ctx.stroke(paths[k]);
      }
    }
    ctx.restore();
    if(frame%30===0) updateStatus();
  }

  function updateStatus(){
    statusEl.innerHTML = done
      ? 'płyta № '+plateNo+' · odbitka gotowa'
      : 'płyta № '+plateNo+' · ruch '+frame;
  }

  function loop(){
    if(!paused && !done){
      var steps = reduced ? 160 : 1;
      for(var i=0;i<steps && !done;i++) simFrame();
    }
    requestAnimationFrame(loop);
  }

  // sterowanie
  document.getElementById('newBtn').addEventListener('click',function(){ newPlate(false); });
  document.getElementById('inkset').addEventListener('change',function(e){
    inks=INKSETS[e.target.value]; newPlate(true);
  });
  pauseBtn.addEventListener('click',function(){
    paused=!paused;
    pauseBtn.textContent=paused?'Wznów':'Wstrzymaj';
  });
  addEventListener('keydown',function(e){
    if(e.target.tagName==='SELECT') return;
    if(e.code==='Space'){ e.preventDefault(); pauseBtn.click(); }
    if(e.key==='n'||e.key==='N') newPlate(false);
  });

  canvas.addEventListener('pointermove',function(e){
    mouse.x=e.clientX; mouse.y=e.clientY; mouse.on=true;
  });
  canvas.addEventListener('pointerleave',function(){ mouse.on=false; mouse.drag=false; });
  canvas.addEventListener('pointerdown',function(e){
    mouse.drag=true; mouse.x=e.clientX; mouse.y=e.clientY; mouse.on=true;
    // kropla tuszu: przenieś część cząstek w miejsce dotknięcia
    for(var i=0;i<130;i++){
      var p=particles[(Math.random()*particles.length)|0];
      var ang=Math.random()*TAU, rad=Math.random()*28;
      spawn(p, e.clientX+Math.cos(ang)*rad, e.clientY+Math.sin(ang)*rad);
    }
    if(done||frame>FULL){ frame=Math.min(frame,FULL); done=false; }
  });
  addEventListener('pointerup',function(){ mouse.drag=false; });

  var rT;
  addEventListener('resize',function(){
    clearTimeout(rT);
    rT=setTimeout(function(){ fit(); newPlate(true); },150);
  });

  fit();
  newPlate(true);
  loop();
})();
</script>
