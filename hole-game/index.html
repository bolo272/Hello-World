<script>
'use strict';
// ============================ CONFIG (buffer px: 1 tile = 16) ==============
const W = 9, T = 16, EDGE = 8, BUFW = W * T + EDGE * 2, SURFACE = 44;
const BRACE_COST = 20;

const MAT = {
  grass:  { name:'TOPSOIL', hp:2,  val:1,   tier:0, col:'#8a5a33', crumble:0.010 },
  dirt:   { name:'DIRT',    hp:3,  val:1,   tier:0, col:'#8a5a33', crumble:0.012 },
  clay:   { name:'CLAY',    hp:6,  val:4,   tier:0, col:'#bf7b45', crumble:0.004 },
  gravel: { name:'GRAVEL',  hp:4,  val:2,   tier:0, col:'#8d8578', crumble:0.050 },

  coal:   { name:'COAL',    hp:8,  val:12,  tier:1, col:'#3a3a42', crumble:0.003 },
  iron:   { name:'IRON',    hp:12, val:20,  tier:2, col:'#a06a48', crumble:0 },
  gold:   { name:'GOLD',    hp:14, val:60,  tier:3, col:'#e8c34a', crumble:0 },
  gem:    { name:'GEMS',    hp:16, val:150, tier:3, col:'#46d6cc', crumble:0 },
  granite:{ name:'GRANITE', hp:24, val:40,  tier:4, col:'#6d6485', crumble:0 },
  pocket: { name:'WATER',   hp:1,  val:0,   tier:0, col:'#3a6ea5', crumble:0 },
  rubble: { name:'RUBBLE',  hp:3,  val:1,   tier:0, col:'#6f675e', crumble:0.020 },
};

const TOOLS = [
  { name:'RUSTY TROWEL', power:1,  tier:0, cost:0,    note:'IT CAME WITH THE GARDEN.' },
  { name:'SHOVEL',       power:2,  tier:1, cost:40,   note:'SOFT GROUND + COAL, TWICE AS FAST.' },
  { name:'PICKAXE',      power:4,  tier:2, cost:200,  note:'CRACKS ROCK AND IRON.' },
  { name:'JACKHAMMER',   power:9,  tier:3, cost:900,  note:'GOLD, GEMS. EVERYTHING BUT GRANITE.' },
  { name:'PLASMA DRILL', power:20, tier:4, cost:3500, note:'MELTS GRANITE. MELTS EVERYTHING.' },
];

// ============================ PIXEL ART =====================================
function mul32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tex(w, h, seed, fn) { const c = mkCanvas(w, h); const g = c.getContext('2d'); fn(g, mul32(seed)); return c; }
function dots(g, rnd, n, cols, w, h) {
  for (let i = 0; i < n; i++) { g.fillStyle = cols[(rnd() * cols.length) | 0]; g.fillRect((rnd() * (T - (w||1))) | 0, (rnd() * (T - (h||1))) | 0, w || 1, h || 1); }
}
function pline(g, pts, col) {   // chunky pixel polyline (Bresenham)
  g.fillStyle = col;
  for (let i = 0; i < pts.length - 1; i++) {
    let [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      g.fillRect(x0, y0, 1, 1);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
}
function base(g, col) { g.fillStyle = col; g.fillRect(0, 0, T, T); }
function nuggets(g, rnd, n, col, hi) {
  for (let i = 0; i < n; i++) {
    const x = 1 + (rnd() * (T - 4)) | 0, y = 1 + (rnd() * (T - 4)) | 0;
    g.fillStyle = col; g.fillRect(x, y, 2, 2);
    g.fillStyle = hi; g.fillRect(x, y, 1, 1);
  }
}
const TEXP = {
  dirt(g, rnd)   { base(g, '#8a5a33'); dots(g, rnd, 22, ['#6f4626', '#7c4f2b'], 1, 1); dots(g, rnd, 8, ['#9d6b3e'], 2, 1); },
  grass(g, rnd)  { TEXP.dirt(g, rnd); g.fillStyle = '#4e8f3a'; g.fillRect(0, 0, T, 4);
                   g.fillStyle = '#5ea847'; for (let x = 0; x < T; x += 2) g.fillRect(x, 0, 1, 2);
                   g.fillStyle = '#3c7030'; for (let x = 1; x < T; x += 3) g.fillRect(x, 3, 1, 2); },
  clay(g, rnd)   { base(g, '#bf7b45'); for (const y of [3, 8, 13]) pline(g, [[0, y], [5, y + 1], [10, y - 1], [15, y]], '#a86438');
                   dots(g, rnd, 6, ['#d18f55'], 1, 1); },
  gravel(g, rnd) { base(g, '#8d8578'); for (let i = 0; i < 7; i++) { const x = (rnd() * 13) | 0, y = (rnd() * 13) | 0;
                   g.fillStyle = rnd() < .5 ? '#a99f90' : '#79715f'; g.fillRect(x, y, 3, 2);
                   g.fillStyle = '#5c5548'; g.fillRect(x, y + 2, 3, 1); } },
  rock(g, rnd)   { base(g, '#6e6e78'); pline(g, [[2, 13], [6, 8], [12, 6]], '#5a5a64'); pline(g, [[9, 15], [11, 10]], '#5a5a64');
                   dots(g, rnd, 6, ['#82828c'], 2, 1); },
  coal(g, rnd)   { base(g, '#4a4a52'); nuggets(g, rnd, 5, '#26262c', '#3c3c46'); dots(g, rnd, 4, ['#5a5a62'], 1, 1); },
  iron(g, rnd)   { TEXP.rock(g, rnd); nuggets(g, rnd, 5, '#b06a3f', '#d1885a'); },
  gold(g, rnd)   { TEXP.rock(g, rnd); nuggets(g, rnd, 5, '#e8c34a', '#fff2a0'); },
  gem(g, rnd)    { TEXP.rock(g, rnd); for (let i = 0; i < 2; i++) { const x = 3 + (rnd() * 8) | 0, y = 3 + (rnd() * 8) | 0;
                   g.fillStyle = '#46d6cc'; g.fillRect(x, y + 1, 3, 2); g.fillRect(x + 1, y, 1, 4);
                   g.fillStyle = '#9df2ec'; g.fillRect(x + 1, y + 1, 1, 1); } },
  granite(g, rnd){ base(g, '#5c5470'); dots(g, rnd, 16, ['#6d6485', '#4a4460'], 1, 1); pline(g, [[1, 12], [7, 7], [14, 3]], '#7c72a0'); },
  pocket(g, rnd) { TEXP.dirt(g, rnd); g.fillStyle = 'rgba(40,80,140,.45)'; g.fillRect(0, 0, T, T);
                   g.fillStyle = '#6fa3d8'; for (let i = 0; i < 4; i++) g.fillRect(2 + (rnd() * 12) | 0, 2 + (rnd() * 12) | 0, 1, 2); },
  rubble(g, rnd) { base(g, '#6f675e'); for (let i = 0; i < 8; i++) { g.fillStyle = ['#57504a', '#837a70', '#4a443e'][(rnd() * 3) | 0];
                   g.fillRect((rnd() * 12) | 0, (rnd() * 12) | 0, 2 + (rnd() * 3) | 0, 2); } },
};
const ATLAS = {}; let seedN = 1;
for (const k of Object.keys(TEXP)) ATLAS[k] = [tex(T, T, seedN += 17, TEXP[k]), tex(T, T, seedN += 17, TEXP[k])];
const BEDROCK = tex(T, T, 99, (g, rnd) => { base(g, '#262230'); g.fillStyle = '#322c40';
  for (let y = 0; y < T; y += 4) for (let x = (y % 8) ? 2 : 0; x < T; x += 6) g.fillRect(x, y, 4, 3); });
const UNKNOWN = tex(T, T, 123, (g, rnd) => { base(g, '#1e1712'); dots(g, rnd, 10, ['#241c15', '#181209'], 2, 1); });

const CRACKS = [
  tex(T, T, 1, g => { pline(g, [[8, 3], [7, 7], [9, 10]], 'rgba(10,6,2,.6)'); }),
  tex(T, T, 1, g => { pline(g, [[8, 3], [7, 7], [9, 10]], 'rgba(10,6,2,.6)'); pline(g, [[7, 7], [3, 9]], 'rgba(10,6,2,.6)'); pline(g, [[9, 10], [12, 13]], 'rgba(10,6,2,.6)'); }),
  tex(T, T, 1, g => { pline(g, [[8, 2], [7, 7], [9, 10], [8, 14]], 'rgba(10,6,2,.7)'); pline(g, [[7, 7], [2, 9]], 'rgba(10,6,2,.7)');
                      pline(g, [[9, 10], [13, 13]], 'rgba(10,6,2,.7)'); pline(g, [[8, 2], [12, 5]], 'rgba(10,6,2,.7)'); }),
];
const WARNS = [
  tex(T, T, 1, g => { pline(g, [[1, 2], [4, 6], [3, 11]], 'rgba(255,90,50,.8)'); pline(g, [[14, 3], [11, 7], [12, 12]], 'rgba(255,90,50,.8)'); }),
  tex(T, T, 1, g => { pline(g, [[1, 2], [4, 6], [8, 9], [3, 14]], 'rgba(255,70,40,.95)'); pline(g, [[14, 3], [11, 7], [8, 9], [13, 14]], 'rgba(255,70,40,.95)');
                      pline(g, [[8, 9], [8, 13]], 'rgba(255,140,60,.9)'); }),
];
const PLANKS = tex(T, T, 7, g => {
  for (const y of [1, 6, 11]) { g.fillStyle = '#8a5f30'; g.fillRect(0, y, T, 4); g.fillStyle = '#6b4820'; g.fillRect(0, y + 3, T, 1); g.fillStyle = '#a5763e'; g.fillRect(0, y, T, 1); }
  g.fillStyle = '#3a2814'; for (const [x, y] of [[2, 2], [13, 2], [2, 12], [13, 12], [7, 7]]) g.fillRect(x, y, 1, 1);
});

const TOOLSPR = [
  tex(T, T, 1, g => { g.fillStyle = '#8a5f30'; g.fillRect(7, 8, 2, 7); g.fillStyle = '#9aa0a8'; g.fillRect(6, 2, 4, 6); g.fillRect(7, 1, 2, 1); g.fillStyle = '#c8ced6'; g.fillRect(6, 2, 1, 5); }),
  tex(T, T, 1, g => { g.fillStyle = '#8a5f30'; g.fillRect(7, 6, 2, 9); g.fillStyle = '#b8bec6'; g.fillRect(5, 0, 6, 6); g.fillStyle = '#e2e8f0'; g.fillRect(5, 0, 2, 6); g.fillStyle = '#6b7078'; g.fillRect(9, 0, 2, 6); }),
  tex(T, T, 1, g => { g.fillStyle = '#8a5f30'; g.fillRect(7, 4, 2, 11); g.fillStyle = '#4a4e56'; g.fillRect(2, 2, 12, 3); g.fillRect(1, 3, 2, 3); g.fillRect(13, 3, 2, 3); g.fillStyle = '#71767e'; g.fillRect(2, 2, 12, 1); }),
  tex(T, T, 1, g => { g.fillStyle = '#e8b02b'; g.fillRect(4, 1, 8, 7); g.fillStyle = '#a87c14'; g.fillRect(4, 7, 8, 1); g.fillStyle = '#3a3a42'; g.fillRect(2, 2, 2, 3); g.fillRect(12, 2, 2, 3); g.fillRect(7, 8, 2, 6); g.fillStyle = '#71767e'; g.fillRect(7, 8, 1, 6); }),
  tex(T, T, 1, g => { g.fillStyle = '#5a2a6e'; g.fillRect(5, 8, 6, 7); g.fillStyle = '#d84ae8'; g.fillRect(6, 1, 4, 7); g.fillRect(7, 0, 2, 1); g.fillStyle = '#7ef2ff'; g.fillRect(7, 2, 1, 5); }),
];
const TOURIST = []; // little pixel people
for (let i = 0; i < 8; i++) TOURIST.push(tex(8, 14, i * 77 + 3, (g, rnd) => {
  const skin = ['#e8b48a', '#c98a5e', '#8a5a3a', '#f0c9a0'][(rnd() * 4) | 0];
  g.fillStyle = ['#3a3226', '#6e4a22', '#1c1c22', '#a8742e'][(rnd() * 4) | 0]; g.fillRect(2, 0, 4, 2);   // hair
  g.fillStyle = skin; g.fillRect(2, 1, 4, 3);                                                            // head
  g.fillStyle = `hsl(${(rnd() * 360) | 0} 60% 50%)`; g.fillRect(1, 4, 6, 5);                             // shirt
  g.fillStyle = skin; g.fillRect(0, 4, 1, 3); g.fillRect(7, 4, 1, 3);                                    // arms
  g.fillStyle = '#2c3040'; g.fillRect(2, 9, 2, 4); g.fillRect(5, 9, 2, 4);                               // legs
  g.fillStyle = '#181a22'; g.fillRect(2, 13, 2, 1); g.fillRect(5, 13, 2, 1);                             // shoes
  if (i % 3 === 0) { g.fillStyle = '#3a3a42'; g.fillRect(5, 3, 3, 2); g.fillStyle = '#7ef2ff'; g.fillRect(6, 3, 1, 1); }  // camera
}));
const CLOUDS = [0, 1].map(i => tex(26, 10, i * 31 + 5, (g, rnd) => {
  g.fillStyle = 'rgba(255,255,255,.92)';
  for (let j = 0; j < 5; j++) { const x = (rnd() * 18) | 0, y = 2 + (rnd() * 4) | 0; g.fillRect(x, y, 8, 4); }
  g.fillStyle = 'rgba(220,230,245,.9)'; g.fillRect(2, 7, 20, 2);
}));
const COIN = tex(8, 8, 3, g => { g.fillStyle = '#a87614'; g.fillRect(1, 0, 6, 8); g.fillRect(0, 1, 8, 6);
  g.fillStyle = '#f5c542'; g.fillRect(1, 1, 6, 6); g.fillStyle = '#fff2a0'; g.fillRect(2, 2, 2, 2); g.fillStyle = '#c99a1e'; g.fillRect(3, 2, 2, 4); });
const ICON_BRACE = tex(16, 16, 9, g => { for (const y of [2, 7, 12]) { g.fillStyle = '#a5763e'; g.fillRect(1, y, 14, 3); g.fillStyle = '#6b4820'; g.fillRect(1, y + 2, 14, 1); } g.fillStyle = '#3a2814'; g.fillRect(2, 3, 1, 1); g.fillRect(13, 8, 1, 1); });
const ICON_BAG = tex(16, 16, 9, g => { g.fillStyle = '#c9a86a'; g.fillRect(3, 5, 10, 9); g.fillStyle = '#a8854a'; g.fillRect(3, 12, 10, 2); g.fillRect(5, 3, 6, 2); g.fillStyle = '#7a5c2c'; g.fillRect(5, 5, 6, 1); g.drawImage(COIN, 4, 6); });
const ICON_CART = tex(16, 16, 9, g => { g.fillStyle = '#8a8f98'; g.fillRect(2, 5, 12, 6); g.fillStyle = '#6b7078'; g.fillRect(2, 10, 12, 1); g.fillStyle = '#3a3a42'; g.fillRect(4, 12, 3, 3); g.fillRect(9, 12, 3, 3); g.fillStyle = '#8a5a33'; g.fillRect(3, 3, 3, 2); g.fillRect(7, 2, 3, 3); g.fillRect(11, 3, 2, 2); });

// ============================ STATE =========================================
const rows = [];
let money = 0, moneyShown = 0, bag = [], bagCap = 10, bagLvl = 0;
let toolIdx = 0, pumpLvl = 0, waterCount = 0;
let record = 0;
let camY = 0, camTarget = 0, followCam = true;
let braceMode = false, shake = 0;
const particles = [], fallers = [], ghosts = [], strikes = [], floaties = [], coins = [], birds = [];
const seen = {};
let lastMilestone = 0, crackHint = null, photoT = 3, touristCoinT = 6, birdT = 4;

function newCell(t) { return { t, dmg: 0, inst: 0, braced: false, seed: Math.random() }; }
const AIR = () => ({ t: 'air' });

function genRow(r) {
  const row = [];
  for (let c = 0; c < W; c++) {
    let t = 'dirt';
    if (r === 0) t = 'grass';
    else {
      const clay = r > 3 ? Math.min(20, 5 + r * 0.5) : 0;
      const gravel = r > 4 ? Math.min(18, 8 + r * 0.3) : 0;
      const rock = r > 6 ? Math.min(24, (r - 6) * 1.5) : 0;
      const coal = r > 6 ? 5 : 0;
      const iron = r > 12 ? 4 : 0;
      const pocket = r > 8 ? 4 : 0;
      const gold = r > 20 ? 2.5 : 0;
      const gem = r > 30 ? 1.5 : 0;
      const granite = r > 25 ? Math.min(12, (r - 25) * 0.8) : 0;
      let x = Math.random() * 100;
      if      ((x -= clay) < 0) t = 'clay';
      else if ((x -= gravel) < 0) t = 'gravel';
      else if ((x -= rock) < 0) t = 'rock';
      else if ((x -= coal) < 0) t = 'coal';
      else if ((x -= iron) < 0) t = 'iron';
      else if ((x -= pocket) < 0) t = 'pocket';
      else if ((x -= gold) < 0) t = 'gold';
      else if ((x -= gem) < 0) t = 'gem';
      else if ((x -= granite) < 0) t = 'granite';

function cell(c, r) { if (c < 0 || c >= W || r < 0) return null; ensureRows(r); return rows[r][c]; }

}

let AC = null;

  try {
    const o = ac.createOscillator(), g = ac.createGain();

    g.gain.setValueAtTime(vol || 0.06, ac.currentTime);

  const ac = audio(); if (!ac) return;
  try {
    const n = ac.sampleRate * 0.4, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();

    g.gain.value = 0.22; s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
  } catch (e) {}

// ============================ ACTIONS =======================================
function tapTile(c, r) {

  if (!isSolid(c, r)) return;
  if (!diggable(c, r)) {
    const p = tileC(c, r);

}

function applyDig(c, r) {
  const x = cell(c, r);
  if (!x || !diggable(c, r)) return;
  const m = MAT[x.t], tool = TOOLS[toolIdx], p = tileC(c, r);
  if (m.tier > tool.tier) {
    blip(90, 0.12, 'square', 0.09); shake = Math.max(shake, 1);
    burst(p.x, p.y, '#ccc', 4, 16);

function breakTile(c, r, x, m, p) {

    setTimeout(() => blip(784, 0.25, 'sine', 0.09), 260);

function flood(vol) {
  const airs = [];
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < W; c++)
    if (rows[r][c].t === 'air') airs.push([c, r]);

function brace(c, r) {

const bagValue = () => bag.reduce((s, t) => s + MAT[t].val, 0);

// ============================ SIMULATION ====================================
let waterTimer = 0, pumpTimer = 0, waterCountT = 0;

function update(dt, time) {
  // strikes: damage lands at the moment of tool impact
  for (let i = strikes.length - 1; i >= 0; i--) {
    const s = strikes[i]; s.t += dt;
    if (!s.hit && s.t >= 0.09) { s.hit = true; applyDig(s.c, s.r); }
    if (s.t > 0.2) strikes.splice(i, 1);
  }
  // wall instability & cave-ins (snapshot count: neighbour checks grow the array)
  const nRows = rows.length;
  for (let r = 1; r < nRows; r++) {
    for (let c = 0; c < W; c++) {
      const x = rows[r][c];
      if (x.t === 'air' || x.t === 'water' || x.braced) continue;
      const m = MAT[x.t];
      let rate = 0;
      if (m.crumble > 0 && (isOpen(c - 1, r) || isOpen(c + 1, r))) rate += m.crumble;
      if (isAir(c, r + 1) && m.crumble > 0) rate += m.crumble * 4 + 0.02;
      if (rate > 0) {
        x.inst += rate * dt * (1 + r * 0.01);
        if (x.inst > 0.55 && !crackHint && !seen.braceHint) { crackHint = { c, r }; seen.braceHint = true; }
        if (x.inst >= 1) collapse(c, r);
      } else if (x.inst > 0) x.inst = Math.max(0, x.inst - dt * 0.05);
    }
  }
  if (crackHint) { const x = rows[crackHint.r] && rows[crackHint.r][crackHint.c];
    if (!x || x.t === 'air' || x.t === 'water' || x.braced || x.inst < 0.3) crackHint = null; }
  // falling cave-in debris
  for (let i = fallers.length - 1; i >= 0; i--) {
    const f = fallers[i];
    if (f.phase === 0) {
      f.pt += dt / 0.16;
      const k = Math.min(1, f.pt), e = k * k * (3 - 2 * k);
      f.x = f.sx + (f.tx - f.sx) * e;
      if (k >= 1) { f.phase = 1; f.x = f.tx; }
    }
    f.vy += 240 * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
    const rBelow = Math.floor((f.y + T + 1 - SURFACE) / T);
    if (f.phase === 1 && rBelow >= 0 && isSolid(f.col, rBelow)) {
      let land = rBelow - 1;
      while (land > 0 && isSolid(f.col, land)) land--;
      if (land >= 0 && !isSolid(f.col, land)) rows[land][f.col] = newCell('rubble');
      const p = tileC(f.col, Math.max(0, land));
      burst(p.x, p.y, MAT.rubble.col, 10, 34);
      shake = Math.max(shake, 1.6); blip(70, 0.12, 'triangle', 0.11);
      fallers.splice(i, 1);
    } else if (f.y > SURFACE + rows.length * T) fallers.splice(i, 1);
  }
  for (let i = ghosts.length - 1; i >= 0; i--) { ghosts[i].life -= dt; if (ghosts[i].life <= 0) ghosts.splice(i, 1); }
  // water sim + eased offsets
  waterTimer += dt;
  if (waterTimer > 0.14) {
    waterTimer = 0;
    for (let r = rows.length - 2; r >= 0; r--) for (let c = 0; c < W; c++) {
      if (rows[r][c].t !== 'water') continue;
      if (rows[r + 1] && rows[r + 1][c].t === 'air') {
        const w = rows[r][c]; rows[r + 1][c] = w; rows[r][c] = AIR(); w.oy = (w.oy || 0) - T;
      } else {
        const dir = Math.random() < 0.5 ? -1 : 1;
        if (cell(c + dir, r) && rows[r][c + dir].t === 'air') {
          const w = rows[r][c]; rows[r][c + dir] = w; rows[r][c] = AIR(); w.ox = (w.ox || 0) - dir * T;
        }
      }
    }
  }
  const wRate = (T / 0.12) * dt;
  for (let r = 0; r < nRows; r++) for (let c = 0; c < W; c++) {
    const w = rows[r][c];
    if (w.t !== 'water') continue;
    if (w.oy) w.oy = Math.abs(w.oy) <= wRate ? 0 : w.oy - Math.sign(w.oy) * wRate;
    if (w.ox) w.ox = Math.abs(w.ox) <= wRate ? 0 : w.ox - Math.sign(w.ox) * wRate;
    if (Math.random() < dt * 0.5) particles.push({ x: EDGE + c * T + 2 + Math.random() * 12, y: SURFACE + r * T + 12, vx: 0, vy: -8, life: 0.6, col: '#9fd0f5', sz: 1, noG: true });
  }
  // pump
  waterCountT += dt;
  if (waterCountT > 0.4) {
    waterCountT = 0; waterCount = 0;
    for (let r = 0; r < rows.length; r++) for (let c = 0; c < W; c++) if (rows[r][c].t === 'water') waterCount++;
  }
  if (pumpLvl > 0 && waterCount > 0) {
    pumpTimer += dt;
    if (pumpTimer > 1 / (0.8 * pumpLvl)) {
      pumpTimer = 0;
      outer: for (let r = 0; r < rows.length; r++) for (let c = 0; c < W; c++)
        if (rows[r][c].t === 'water') {
          rows[r][c] = AIR(); blip(500, 0.05, 'sine', 0.03);
          const p = tileC(c, r); burst(p.x, p.y, '#6fb3e8', 5, 18);
          waterCount--; break outer;
        }
    }
  }
  // tourists pay
  if (record >= 10) {
    money += record * 0.06 * dt;
    touristCoinT -= dt;
    if (touristCoinT <= 0) { touristCoinT = 4 + Math.random() * 3; const tp = touristPos((Math.random() * touristCount()) | 0);
      if (tp) coinFlyFrom(tp.cssX, tp.cssY); }
  }
  // ambient birds
  birdT -= dt;
  if (birdT <= 0 && camY < SURFACE) { birdT = 6 + Math.random() * 8;
    birds.push({ x: -10, y: 6 + Math.random() * 18, v: 14 + Math.random() * 8 }); }
  for (let i = birds.length - 1; i >= 0; i--) { birds[i].x += birds[i].v * dt; if (birds[i].x > BUFW + 10) birds.splice(i, 1); }
  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (!p.noG) p.vy += 130 * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  // floaties & coins
  for (let i = floaties.length - 1; i >= 0; i--) { const f = floaties[i]; f.t += dt; f.y -= 9 * dt; if (f.t > f.life) floaties.splice(i, 1); }
  for (let i = coins.length - 1; i >= 0; i--) { const cn = coins[i]; cn.t += dt / cn.dur; if (cn.t >= 1) { coins.splice(i, 1); blip(1174, 0.05, 'sine', 0.04); } }
  // camera & money tween
  if (followCam) camY += (camTarget - camY) * Math.min(1, dt * 5);
  if (shake > 0) shake = Math.max(0, shake - dt * 6);
  moneyShown += (money - moneyShown) * Math.min(1, dt * 8);
  if (Math.abs(money - moneyShown) < 1) moneyShown = money;
}

// ============================ RENDER ========================================
const cv = document.getElementById('game');
const mctx = cv.getContext('2d');
let buf = mkCanvas(BUFW, 300), bctx = buf.getContext('2d');
let pxScale = 2, cssW = 390, cssH = 780, dpr = 1;

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cssW = cv.clientWidth; cssH = cv.clientHeight;
  cv.width = cssW * dpr; cv.height = cssH * dpr;
  pxScale = cssW / BUFW;
  buf.height = Math.ceil(cssH / pxScale) + 1;
  bctx = buf.getContext('2d');
}
window.addEventListener('resize', resize);
function viewH() { return buf.height; }
function clampCam(v) { return Math.max(0, Math.min(v, SURFACE + (record + 6) * T - viewH() * 0.7)); }
const easeOut = k => 1 - (1 - k) * (1 - k);

function touristCount() { return record >= 10 ? Math.min(8, 2 + Math.floor(record / 10) * 2) : 0; }
const TOURIST_X = [16, 34, 118, 136, 50, 102, 24, 128];
function touristPos(i) {
  if (i >= touristCount()) return null;
  const bx = TOURIST_X[i], by = SURFACE - 14;
  return { bx, by, cssX: bx * pxScale, cssY: (by - camY) * pxScale };
}

function draw(time) {
  const H = buf.height;
  const camR = Math.round(camY);
  const sx = shake > 0.2 ? Math.round((Math.random() - 0.5) * shake) : 0;
  const sy = shake > 0.2 ? Math.round((Math.random() - 0.5) * shake) : 0;

  // ---------- 1) world into low-res buffer ----------
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  bctx.clearRect(0, 0, BUFW, H);
  bctx.translate(sx, sy - camR);

  // sky
  if (camR < SURFACE + 20) {
    const g = bctx.createLinearGradient(0, -60, 0, SURFACE);
    g.addColorStop(0, '#6fbdf0'); g.addColorStop(1, '#cfe9fa');
    bctx.fillStyle = g; bctx.fillRect(0, camR - 60, BUFW, SURFACE - camR + 80);
    bctx.fillStyle = '#ffe28a'; bctx.fillRect(BUFW - 26, 8, 8, 8); bctx.fillRect(BUFW - 24, 6, 4, 12); bctx.fillRect(BUFW - 28, 10, 12, 4);
    bctx.drawImage(CLOUDS[0], ((time / 900) % (BUFW + 60)) - 30, 10);
    bctx.drawImage(CLOUDS[1], ((time / 1400 + 80) % (BUFW + 60)) - 30, 22);
    for (const b of birds) {
      bctx.fillStyle = '#2c3040';
      const f = ((time / 180) | 0) % 2;
      bctx.fillRect(b.x - 2, b.y + (f ? 0 : -1), 2, 1); bctx.fillRect(b.x, b.y, 1, 1); bctx.fillRect(b.x + 1, b.y + (f ? 0 : -1), 2, 1);
    }
    // sign post
    bctx.fillStyle = '#5c3719'; bctx.fillRect(6, SURFACE - 12, 2, 12);
    bctx.fillStyle = '#8a5a2e'; bctx.fillRect(1, SURFACE - 17, 26, 8);
    bctx.fillStyle = '#3a2412'; bctx.fillRect(1, SURFACE - 17, 26, 1); bctx.fillRect(1, SURFACE - 10, 26, 1);
    // tourists
    const n = touristCount();
    for (let i = 0; i < n; i++) {
      const tp = touristPos(i);
      const bob = Math.round(Math.sin(time / 350 + i * 1.7));
      bctx.drawImage(TOURIST[i % TOURIST.length], tp.bx - 4, tp.by + bob);
      if (((time / 100) | 0) % 40 === i * 4) { bctx.fillStyle = '#fff'; bctx.fillRect(tp.bx + 2, tp.by + 2 + bob, 3, 3); }
    }
    // waving grass tufts on the rim
    bctx.fillStyle = '#5ea847';
    for (let gx = 2; gx < BUFW; gx += 7) {
      const sway = Math.round(Math.sin(time / 500 + gx));
      bctx.fillRect(gx + sway, SURFACE - 2, 1, 2);
    }
  }

  const r0 = Math.max(0, Math.floor((camR - SURFACE) / T) - 1);
  const r1 = Math.floor((camR + H - SURFACE) / T) + 1;
  ensureRows(r1);

  // bedrock edges
  let ey = SURFACE + Math.max(0, Math.floor((camR - SURFACE) / T)) * T;
  for (; ey < camR + H; ey += T) {
    bctx.drawImage(BEDROCK, 0, 0, EDGE, T, 0, ey, EDGE, T);
    bctx.drawImage(BEDROCK, 0, 0, EDGE, T, BUFW - EDGE, ey, EDGE, T);
  }

  for (let r = r0; r <= r1; r++) {
    if (r < 0 || !rows[r]) continue;
    const y = SURFACE + r * T;
    for (let c = 0; c < W; c++) {
      const x = rows[r][c], px = EDGE + c * T;
      if (x.t === 'air' || x.t === 'water') {
        bctx.fillStyle = '#120d1a'; bctx.fillRect(px, y, T, T);
        continue;   // water drawn in a later pass
      }
      if (!revealed(c, r)) { bctx.drawImage(UNKNOWN, px, y); continue; }
      const v = x.seed < 0.5 ? 0 : 1;
      bctx.drawImage(ATLAS[x.t][v], px, y);
      // 2.5D edge light/shade
      if (r > 0 && isAir(c, r - 1)) { bctx.fillStyle = 'rgba(255,235,200,.30)'; bctx.fillRect(px, y, T, 2); }
      if (isOpen(c + 1, r)) { bctx.fillStyle = 'rgba(0,0,0,.30)'; bctx.fillRect(px + T - 2, y, 2, T); }
      if (isOpen(c - 1, r)) { bctx.fillStyle = 'rgba(255,255,255,.12)'; bctx.fillRect(px, y, 1, T); }
      if (isOpen(c, r + 1)) { bctx.fillStyle = 'rgba(0,0,0,.35)'; bctx.fillRect(px, y + T - 2, T, 2); }
      // ore sparkle
      if ((x.t === 'gold' || x.t === 'gem') && ((time / 160 + x.seed * 40) | 0) % 11 === 0) {
        bctx.fillStyle = '#fff'; bctx.fillRect(px + 3 + ((x.seed * 9) | 0), y + 3 + ((x.seed * 7) | 0), 1, 1);
      }
      // damage cracks + progress pips
      const dr = x.dmg / MAT[x.t].hp;
      if (dr > 0) {
        bctx.drawImage(CRACKS[dr > 0.66 ? 2 : dr > 0.33 ? 1 : 0], px, y);
        bctx.fillStyle = '#241708'; bctx.fillRect(px + 2, y - 3, T - 4, 2);
        bctx.fillStyle = dr > 0.66 ? '#f5c542' : '#8fe388'; bctx.fillRect(px + 2, y - 3, Math.max(1, (T - 4) * dr) | 0, 2);
      }
      // instability warning
      if (x.inst > 0.45) {
        const jx = x.inst > 0.72 ? ((Math.random() * 3) | 0) - 1 : 0;
        bctx.drawImage(WARNS[x.inst > 0.72 ? 1 : 0], px + jx, y);
        if (((time / 250) | 0) % 2 === 0) {   // blinking "!"
          bctx.fillStyle = x.inst > 0.72 ? '#ff5a3c' : '#f5c542';
          bctx.fillRect(px + 7, y - 8, 2, 4); bctx.fillRect(px + 7, y - 3, 2, 2);
        }
        if (x.inst > 0.72 && Math.random() < 0.08) burst(px + 8, y + 12, MAT[x.t].col, 1, 8);
      }
      if (x.braced) bctx.drawImage(PLANKS, px, y);
      else if (braceMode && exposedWall(c, r) && MAT[x.t].crumble > 0) {
        bctx.globalAlpha = 0.35 + 0.15 * Math.sin(time / 200);
        bctx.drawImage(PLANKS, px, y); bctx.globalAlpha = 1;
      }
      if (x.flashUntil && time < x.flashUntil) { bctx.fillStyle = 'rgba(255,255,255,.55)'; bctx.fillRect(px, y, T, T); }
    }
  }

  // darkness deepens with… depth; torches push it back
  for (let r = Math.max(r0, 6); r <= r1; r++) {
    const a = Math.min(0.5, (r - 6) * 0.016);
    if (a <= 0) continue;
    bctx.fillStyle = `rgba(6,4,14,${a})`;
    bctx.fillRect(0, SURFACE + r * T, BUFW, T);
  }
  for (let d = 5; d <= record; d += 5) {
    const ty = SURFACE + d * T - 6, left = (d / 5) % 2 === 1;
    const tx = left ? 2 : BUFW - 5;
    bctx.fillStyle = '#5c3719'; bctx.fillRect(tx, ty, 3, 6);
    const fl = ((time / 130) | 0) % 2;
    bctx.fillStyle = '#ffb23a'; bctx.fillRect(tx, ty - 3 - fl, 3, 3 + fl);
    bctx.fillStyle = '#fff2a0'; bctx.fillRect(tx + 1, ty - 2 - fl, 1, 2);
    const gl = bctx.createRadialGradient(tx + 1, ty, 1, tx + 1, ty, 22);
    gl.addColorStop(0, 'rgba(255,170,60,.28)'); gl.addColorStop(1, 'rgba(255,170,60,0)');
    bctx.globalCompositeOperation = 'lighter';
    bctx.fillStyle = gl; bctx.fillRect(tx - 22, ty - 22, 44, 44);
    bctx.globalCompositeOperation = 'source-over';
  }

  // water pass (eased offsets)
  for (let r = r0; r <= r1; r++) {
    if (r < 0 || !rows[r]) continue;
    for (let c = 0; c < W; c++) {
      const x = rows[r][c];
      if (x.t !== 'water') continue;
      const wx = EDGE + c * T + (x.ox || 0), wy = SURFACE + r * T + (x.oy || 0);
      const a = x.born ? Math.min(0.78, 0.15 + (time - x.born) / 350) : 0.78;
      bctx.fillStyle = `rgba(52,120,190,${a})`;
      bctx.fillRect(wx, wy, T, T);
      if (!isWater(c, r - 1)) {
        bctx.fillStyle = `rgba(160,210,255,${a * 0.9})`;
        const wave = ((time / 260 + c) | 0) % 2;
        bctx.fillRect(wx, wy + 1 + wave, T, 1);
      }
    }
  }

  // falling debris
  for (const f of fallers) {
    bctx.save();
    bctx.translate(f.x + T / 2, f.y + T / 2);
    bctx.rotate(f.rot);
    bctx.drawImage(ATLAS[f.t][0], -T / 2, -T / 2);
    bctx.restore();
    if (Math.random() < 0.35) burst(f.x + T / 2, f.y + T / 2, MAT[f.t].col, 1, 12);
  }
  // crumble ghosts
  for (const g2 of ghosts) {
    const k = g2.life / g2.max, s = Math.max(2, (T * k) | 0);
    bctx.globalAlpha = k;
    bctx.drawImage(ATLAS[g2.t] ? ATLAS[g2.t][0] : UNKNOWN, EDGE + g2.c * T + ((T - s) >> 1), SURFACE + g2.r * T + ((T - s) >> 1), s, s);
  }
  bctx.globalAlpha = 1;
  // tool swing on the latest strike
  const st = strikes[strikes.length - 1];
  if (st) {
    const k = Math.min(1, st.t / 0.13);
    const ang = -2.1 + 1.8 * easeOut(k);
    const p = tileC(st.c, st.r);
    bctx.save();
    bctx.translate(p.x + 7, p.y - 9);
    bctx.rotate(ang);
    bctx.drawImage(TOOLSPR[toolIdx], -8, -14);
    bctx.restore();
    if (st.hit && st.t < 0.16) {   // impact star
      bctx.fillStyle = '#fff';
      bctx.fillRect(p.x - 1, p.y - 4, 2, 8); bctx.fillRect(p.x - 4, p.y - 1, 8, 2);
    }
  }
  // particles
  for (const p of particles) {
    bctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    bctx.fillStyle = p.col;
    bctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, Math.max(1, p.sz | 0), Math.max(1, p.sz | 0));
  }
  bctx.globalAlpha = 1;

  // ---------- 2) blit chunky pixels ----------
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mctx.imageSmoothingEnabled = false;
  mctx.clearRect(0, 0, cssW, cssH);
  mctx.fillStyle = '#14101c'; mctx.fillRect(0, 0, cssW, cssH);
  mctx.drawImage(buf, 0, 0, BUFW, buf.height, 0, 0, BUFW * pxScale, buf.height * pxScale);

  // ---------- 3) crisp overlay: text, hints, coins, vignette ----------
  const toCss = (bx, by) => [bx * pxScale, (by - camY) * pxScale];
  mctx.textAlign = 'center';
  // sign text
  if (camY < SURFACE) {
    const [tx, ty] = toCss(14, SURFACE - 11.5);
    mctx.font = `${Math.max(7, 3.2 * pxScale)}px 'Press Start 2P', monospace`;
    mctx.fillStyle = '#f2e3c2'; mctx.fillText('THE HOLE', tx, ty);
  }
  // depth markers
  mctx.font = `${Math.max(8, 3.4 * pxScale)}px 'Press Start 2P', monospace`;
  mctx.textAlign = 'left';
  for (let d = 5; d <= r1; d += 5) {
    if (d < r0) continue;
    const [, my] = toCss(0, SURFACE + d * T + 5);
    if (my < -10 || my > cssH + 10) continue;
    mctx.fillStyle = 'rgba(0,0,0,.6)'; mctx.fillText(d + 'm', 5, my + 1);
    mctx.fillStyle = d <= record ? '#f5c542' : 'rgba(200,190,220,.55)'; mctx.fillText(d + 'm', 4, my);
  }
  mctx.textAlign = 'center';
  // floaties
  for (const f of floaties) {
    const [fx, fy] = toCss(f.x, f.y);
    const a = f.t < 0.15 ? f.t / 0.15 : Math.max(0, 1 - (f.t - f.life * 0.55) / (f.life * 0.45));
    mctx.globalAlpha = Math.min(1, a);
    mctx.font = `${f.size + 2}px 'Press Start 2P', monospace`;
    mctx.fillStyle = 'rgba(0,0,0,.7)'; mctx.fillText(f.text, fx + 2, fy + 2);
    mctx.fillStyle = f.col; mctx.fillText(f.text, fx, fy);
  }
  mctx.globalAlpha = 1;
  // coins
  for (const cn of coins) {
    const k = easeOut(cn.t);
    const mx = cn.x0 + (cn.x1 - cn.x0) * k;
    const my = cn.y0 + (cn.y1 - cn.y0) * k - Math.sin(Math.PI * k) * 60;
    mctx.drawImage(COIN, mx - 8, my - 8, 16, 16);
  }
  // hints
  mctx.font = `10px 'Press Start 2P', monospace`;
  if (!seen.dug) {
    const p = tileC(4, 0);
    const [hx, hy] = toCss(p.x, p.y - 14);
    const bob = Math.sin(time / 250) * 5;
    drawArrow(mctx, hx, hy + bob, '#f5c542');
    mctx.fillStyle = 'rgba(0,0,0,.7)'; mctx.fillText('TAP TO DIG', hx + 1, hy - 26 + bob + 1);
    mctx.fillStyle = '#f5c542'; mctx.fillText('TAP TO DIG', hx, hy - 26 + bob);
  }
  if (crackHint) {
    const p = tileC(crackHint.c, crackHint.r);
    const [hx, hy] = toCss(p.x, p.y - 14);
    if (hy > 20 && hy < cssH - 20) {
      const bob = Math.sin(time / 200) * 4;
      drawArrow(mctx, hx, hy + bob, '#ff5a3c');
      mctx.fillStyle = 'rgba(0,0,0,.7)'; mctx.fillText('BRACE IT!', hx + 1, hy - 26 + bob + 1);
      mctx.fillStyle = '#ff5a3c'; mctx.fillText('BRACE IT!', hx, hy - 26 + bob);
    }
  }
  // danger vignette
  if (shake > 0.5) {
    mctx.fillStyle = `rgba(200,40,20,${Math.min(0.22, shake * 0.05)})`;
    mctx.fillRect(0, 0, cssW, 8); mctx.fillRect(0, cssH - 8, cssW, 8);
    mctx.fillRect(0, 0, 8, cssH); mctx.fillRect(cssW - 8, 0, 8, cssH);
  }
}
function drawArrow(g, x, y, col) {
  g.fillStyle = 'rgba(0,0,0,.7)';
  g.beginPath(); g.moveTo(x + 1, y + 1); g.lineTo(x - 9, y - 13); g.lineTo(x + 11, y - 13); g.closePath(); g.fill();
  g.fillStyle = col;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x - 10, y - 14); g.lineTo(x + 10, y - 14); g.closePath(); g.fill();
}

// ============================ HUD / SHOP ====================================
const $ = id => document.getElementById(id);
$('coinIc').src = COIN.toDataURL();
$('braceIc').src = ICON_BRACE.toDataURL();
$('sellIc').src = ICON_BAG.toDataURL();
$('shopIc').src = ICON_CART.toDataURL();
function setToolChip() { $('toolIc').src = TOOLSPR[toolIdx].toDataURL(); $('toolName').textContent = TOOLS[toolIdx].name; }
setToolChip();

function refreshHUD() {
  $('depthTxt').textContent = record + 'm';
  $('moneyTxt').textContent = Math.floor(moneyShown).toLocaleString();
  $('sellSub').textContent = `bag ${bag.length}/${bagCap} · $${bagValue()}`;
  $('bagFill').style.width = Math.min(100, (bag.length / bagCap) * 100) + '%';
  const pc = $('pumpChip');
  if (pumpLvl > 0 && waterCount > 0) { pc.classList.add('on'); $('waterN').textContent = waterCount; }
  else pc.classList.remove('on');
}

function renderShop() {
  const el = $('shopItems'); el.replaceChildren();
  const add = (iconCanvas, title, sub, cost, fn, done) => {
    const d = document.createElement('div'); d.className = 'item';
    const img = document.createElement('img'); img.src = iconCanvas.toDataURL();
    const tx = document.createElement('div'); tx.className = 'tx';
    tx.innerHTML = `<b>${title}</b><span>${sub}</span>`;
    const b = document.createElement('button');
    b.textContent = done ? 'MAX' : '$' + cost.toLocaleString();
    b.disabled = done || money < cost;
    b.onclick = () => { if (money >= cost && !done) { money -= cost; fn(); refreshHUD(); renderShop(); blip(700, 0.1, 'sine', 0.07); } };
    d.append(img, tx, b); el.appendChild(d);
  };
  const next = TOOLS[toolIdx + 1];
  if (next) add(TOOLSPR[toolIdx + 1], next.name, `${next.note} POWER ${next.power}.`, next.cost,
    () => { toolIdx++; setToolChip(); say(next.name + ' EQUIPPED!', 2200); });
  else add(TOOLSPR[toolIdx], 'BEST TOOL OWNED', 'THE EARTH TREMBLES BEFORE YOU.', 0, () => {}, true);
  add(ICON_BAG, `BIGGER BAG (${bagCap} > ${bagCap + 10})`, 'HAUL MORE BEFORE SELLING.', 50 * Math.pow(2, bagLvl), () => { bagLvl++; bagCap += 10; });
  add(tex(16, 16, 5, g => { g.fillStyle = '#274b73'; g.fillRect(3, 4, 10, 10); g.fillStyle = '#6fb3e8'; g.fillRect(5, 6, 6, 6); g.fillStyle = '#8a8f98'; g.fillRect(6, 0, 4, 5); }),
    pumpLvl === 0 ? 'WATER PUMP' : `PUMP LEVEL ${pumpLvl + 1}`,
    pumpLvl === 0 ? 'AUTO-DRAINS FLOODED TILES.' : 'PUMPS WATER FASTER.',
    250 * Math.pow(2, pumpLvl), () => { pumpLvl++; say(pumpLvl === 1 ? 'PUMP INSTALLED!' : 'PUMP UPGRADED!', 1800); });
  const d = document.createElement('div'); d.className = 'item';
  const img = document.createElement('img'); img.src = ICON_BRACE.toDataURL();
  const tx = document.createElement('div'); tx.className = 'tx';
  tx.innerHTML = `<b>BRACES - $${BRACE_COST} EACH</b><span>TOGGLE BRACE MODE, TAP A CRACKING WALL TO HOLD IT FOREVER. GRAVEL ALWAYS NEEDS IT.</span>`;
  d.append(img, tx); el.appendChild(d);
}

$('sellBtn').onclick = () => { audio(); sellBag(); refreshHUD(); };
$('braceBtn').onclick = () => {
  audio(); braceMode = !braceMode;
  $('braceBtn').classList.toggle('on', braceMode);
  say(braceMode ? 'BRACE MODE: TAP WALLS TO SUPPORT THEM.' : 'BACK TO DIGGING.', 1500);
};
$('shopBtn').onclick = () => { audio(); renderShop(); $('shop').classList.add('open'); };
$('closeShop').onclick = () => $('shop').classList.remove('open');

// ============================ INPUT =========================================
let pDown = null, dragging = false;
cv.addEventListener('pointerdown', e => {
  audio();
  pDown = { x: e.clientX, y: e.clientY, camY };
  dragging = false;
});
cv.addEventListener('pointermove', e => {
  if (!pDown) return;
  const dy = e.clientY - pDown.y, dx = e.clientX - pDown.x;
  if (!dragging && Math.hypot(dx, dy) > 12) { dragging = true; followCam = false; }
  if (dragging) camY = clampCam(pDown.camY - dy / pxScale);
});
cv.addEventListener('pointerup', e => {
  if (pDown && !dragging) {
    const rect = cv.getBoundingClientRect();
    const bx = (e.clientX - rect.left) / pxScale;
    const by = (e.clientY - rect.top) / pxScale + camY;
    const c = Math.floor((bx - EDGE) / T);
    const r = Math.floor((by - SURFACE) / T);
    if (c >= 0 && c < W && r >= 0) {
      tapTile(c, r);
      followCam = true; camTarget = clampCam(camY);
      refreshHUD();
    }
  }
  pDown = null; dragging = false;
});
cv.addEventListener('pointercancel', () => { pDown = null; dragging = false; });
window.addEventListener('wheel', e => { followCam = false; camY = clampCam(camY + e.deltaY / pxScale); }, { passive: true });

// ============================ MAIN LOOP =====================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt, now);
  draw(now);
  refreshHUD();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

// dev/test handle (harmless in production, handy for playtesting)
window.__hole = { rows, newCell, snapshot: () => ({ money, record, bag: bag.slice(), pumpLvl }), cheat: v => { money += v; } };
</script>
