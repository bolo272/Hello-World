<script>
'use strict';
// ================= world constants ==========================================
const CELL = 10, COLS = 120, BANK = 6, WORLD_W = COLS * CELL;      // 1200 world px
const CH_ROWS = 64, CH_H = CH_ROWS * CELL;                          // chunk = 640 px tall
const BRUSH = 30, M = 40;                                           // 40 px = 1 metre
const TY = { EMPTY:0, LOAM:1, CLAY:2, SAND:3, STONE:4, CRYSTAL:5, SPRING:6, BANK:7 };
const DIGRATE = { [TY.LOAM]:0.9, [TY.CLAY]:0.42, [TY.SAND]:1.35, [TY.STONE]:0.15, [TY.CRYSTAL]:0.13, [TY.SPRING]:2.5 };
const HP0     = { [TY.LOAM]:1, [TY.CLAY]:1, [TY.SAND]:1, [TY.STONE]:1, [TY.CRYSTAL]:1, [TY.SPRING]:0.4 };

// deterministic hash noise
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) ^ 0x5bf03635; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, s) {
  const gx = Math.floor(x / s), gy = Math.floor(y / s), fx = x / s - gx, fy = y / s - gy;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = hash2(gx, gy), b = hash2(gx + 1, gy), c = hash2(gx, gy + 1), d = hash2(gx + 1, gy + 1);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}

function genType(cx, cy) {
  if (cx < BANK || cx >= COLS - BANK) return TY.BANK;
  const d = cy * CELL;
  if (d > 350 && hash2(cx * 3 + 7, cy * 5 + 1) < 0.0011) return TY.SPRING;
  if (d > 850 && vnoise(cx + 130, cy + 31, 5) > 0.80) return TY.CRYSTAL;

  // moths orbit lanterns at night
  const wantMoths = nightness() > 0.5 ? lanterns.length * 2 : 0;
  while (moths.length < wantMoths) { const L = lanterns[(Math.random() * lanterns.length) | 0]; moths.push({ L, ph: Math.random() * 7, r: 8 + Math.random() * 8 }); }
  if (moths.length > wantMoths) moths.splice(0, moths.length - wantMoths);
  for (const m of moths) m.ph += dt * (2 + m.r * 0.05);
  // ambient sounds
  chirpT -= dt;
  if (chirpT < 0) { chirpT = 3 + Math.random() * 6; if (camY < 300 && dayness() > 0.4 && started) chirp(); }
  dripT -= dt;
  if (dripT < 0) { dripT = 4 + Math.random() * 7; if (waterCells > 0 && camY > 100 && started) drip(); }
  // particles
  for (let i = crumbs.length - 1; i >= 0; i--) {
    const p = crumbs[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 240 * dt;
    if (p.life <= 0) crumbs.splice(i, 1);
  }
  for (let i = pebbles.length - 1; i >= 0; i--) {
    const p = pebbles[i]; p.t += dt;
    if (!p.settled) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt;
      const cy = ((p.y + p.r) / CELL) | 0, cx = (p.x / CELL) | 0;
      if (isSolid(cx, cy)) {
        if (Math.abs(p.vy) > 40) { p.vy *= -0.32; p.vx *= 0.6; tone(500 + Math.random() * 300, 0.06, 0.02); }
        else { p.settled = true; p.y = cy * CELL - p.r; }
      }
      if (p.y > maxDepthPx + 900) pebbles.splice(i, 1);
    } else if (p.t > 9) pebbles.splice(i, 1);
  }
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i]; s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 30 * dt;
    if (s.life <= 0) sparkles.splice(i, 1);
  }
  // camera: gentle follow while carving deep, inertial scroll
  camY += camVel * dt; camVel *= Math.pow(0.05, dt);
  if (carving) {
    const targetScreen = cssH * 0.62;
    const wyScreen = (mouse.y);
    if (wyScreen > targetScreen) camY += (wyScreen - targetScreen) / scale * dt * 1.6;
  }
  camY = Math.max(-420, Math.min(camY, maxDepthPx + 420 - cssH / scale * 0.5));
}

// ================= day cycle ================================================
function cyc() { return cycOverride !== null ? cycOverride : (cyc0 + performance.now() / 1000 / CYCLE_S) % 1; }
// keyframes: [t, skyTop, skyBottom, glow, ambientDark]
const SKY = [
  [0.00, '#f3d9b0', '#f7e8cf', '#ffd9a0', 0.18],
  [0.10, '#aecfe8', '#e2eef5', '#fff2d9', 0.00],
  [0.48, '#a5cae6', '#dcecf4', '#fff2d9', 0.00],
  [0.60, '#e8b98e', '#f4d7ad', '#ffc98a', 0.14],
  [0.70, '#2c3050', '#4a4f73', '#a8b4e8', 0.52],
  [0.93, '#232742', '#3a3f63', '#9aa8e0', 0.55],
  [1.00, '#f3d9b0', '#f7e8cf', '#ffd9a0', 0.18],
];
function skyNow() {
  const t = cyc();
  for (let i = 0; i < SKY.length - 1; i++) {
    if (t >= SKY[i][0] && t <= SKY[i + 1][0]) {
      const k = (t - SKY[i][0]) / (SKY[i + 1][0] - SKY[i][0] + 1e-6);
      return { top: mix(SKY[i][1], SKY[i + 1][1], k), bot: mix(SKY[i][2], SKY[i + 1][2], k),
               glow: mix(SKY[i][3], SKY[i + 1][3], k), amb: lerp(SKY[i][4], SKY[i + 1][4], k) };
    }
  }
  return { top: SKY[1][1], bot: SKY[1][2], glow: SKY[1][3], amb: 0 };
}
function nightness() { const t = cyc(); return t > 0.64 && t < 0.97 ? 1 : (t > 0.58 && t <= 0.64 ? (t - 0.58) / 0.06 : (t >= 0.97 ? 1 - (t - 0.97) / 0.03 : 0)); }
function dayness() { return 1 - nightness(); }

// ================= render ===================================================
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const oCan = document.createElement('canvas'); const octx = oCan.getContext('2d');
const cavePat = tex => { const c = document.createElement('canvas'); c.width = c.height = 160; const g = c.getContext('2d');
  for (let i = 0; i < 130; i++) { g.fillStyle = `rgba(${20 + Math.random() * 26},${14 + Math.random() * 20},${30 + Math.random() * 26},.5)`;
    g.beginPath(); g.arc(Math.random() * 160, Math.random() * 160, 2 + Math.random() * 7, 0, 7); g.fill(); }
  return c; };
const CAVE = cavePat();
let cavePattern = null;

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cssW = cv.clientWidth; cssH = cv.clientHeight;
  cv.width = cssW * dpr; cv.height = cssH * dpr;
  scale = cssW / WORLD_W;
  oCan.width = Math.ceil(cssW / 2); oCan.height = Math.ceil(cssH / 2);
}
window.addEventListener('resize', resize);

const sY = wy => (wy - camY) * scale;
const sX = wx => wx * scale;

function draw(time) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  const sky = skyNow(), night = nightness();

  // --- sky ---
  const horizon = sY(0);
  if (horizon > 0) {
    const g = ctx.createLinearGradient(0, Math.min(0, sY(-420)), 0, horizon);
    g.addColorStop(0, sky.top); g.addColorStop(1, sky.bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, cssW, Math.max(0, horizon));
    // stars
    if (night > 0.05) {
      ctx.fillStyle = `rgba(240,240,255,${0.8 * night})`;
      for (let i = 0; i < 70; i++) {
        const x = hash2(i, 7) * cssW, y = hash2(i, 13) * Math.max(1, horizon * 0.8);
        const tw = 0.4 + 0.6 * Math.abs(Math.sin(time / 900 + i));
        ctx.globalAlpha = night * tw; ctx.fillRect(x, y, 1.6, 1.6);
      }
      ctx.globalAlpha = 1;
    }
    // sun / moon
    const t = cyc();
    const dayArc = Math.min(1, Math.max(0, (t - 0.02) / 0.62));
    const sunX = cssW * (0.12 + dayArc * 0.76), sunY = horizon - Math.sin(dayArc * Math.PI) * (horizon * 0.72) - 20;
    if (t < 0.66) {
      const [r, gg, b] = hexAny(sky.glow);
      const sg2 = ctx.createRadialGradient(sunX, sunY, 4, sunX, sunY, 60);
      sg2.addColorStop(0, `rgba(${r},${gg},${b},.9)`); sg2.addColorStop(1, `rgba(${r},${gg},${b},0)`);
      ctx.fillStyle = sg2; ctx.fillRect(sunX - 60, sunY - 60, 120, 120);
      ctx.fillStyle = '#fff6dd'; ctx.beginPath(); ctx.arc(sunX, sunY, 17, 0, 7); ctx.fill();
    } else {
      const mt = (t - 0.66) / 0.34;
      const mx = cssW * (0.15 + mt * 0.7), my = horizon - Math.sin(mt * Math.PI) * (horizon * 0.6) - 20;
      ctx.fillStyle = 'rgba(235,238,250,.92)'; ctx.beginPath(); ctx.arc(mx, my, 13, 0, 7); ctx.fill();
      ctx.fillStyle = sky.top; ctx.beginPath(); ctx.arc(mx + 6, my - 3, 11, 0, 7); ctx.fill();
    }
    // hills
    for (const [off, colDay, colNight, amp, sp] of [[0, '#b7c9a4', '#333856', 26, 260], [40, '#9db28a', '#2b3049', 38, 170]]) {
      ctx.fillStyle = mix(colDay, colNight, night);
      ctx.beginPath(); ctx.moveTo(0, horizon);
      for (let x = 0; x <= cssW; x += 16) ctx.lineTo(x, horizon - 14 - off * 0.5 - vnoise(x + off * 9, 4, sp) * amp);
      ctx.lineTo(cssW, horizon); ctx.closePath(); ctx.fill();
    }
    // clouds
    ctx.fillStyle = `rgba(255,255,255,${0.6 * (0.35 + dayness() * 0.65)})`;
    for (let i = 0; i < 4; i++) {
      const cx2 = ((time / (26000 + i * 8000) + i * 0.3) % 1.2 - 0.1) * cssW;
      const cy2 = horizon * (0.18 + 0.16 * hash2(i, 3));
      for (let j = 0; j < 4; j++)
        { ctx.beginPath(); ctx.ellipse(cx2 + j * 22 - 30, cy2 + (j % 2) * 5, 26 - j * 4, 11, 0, 0, 7); ctx.fill(); }
    }
  }

  // --- cave backdrop (shows through dug earth) ---
  const gy0 = Math.max(0, horizon);
  if (gy0 < cssH) {
    // warm near the daylight, cool and deep further down
    const g = ctx.createLinearGradient(0, sY(0), 0, sY(1300));
    g.addColorStop(0, mix('#584550', '#241c30', nightness() * 0.7));
    g.addColorStop(1, '#151020');
    ctx.fillStyle = g; ctx.fillRect(0, gy0, cssW, cssH - gy0);
    if (!cavePattern) cavePattern = ctx.createPattern(CAVE, 'repeat');
    ctx.save();
    ctx.beginPath(); ctx.rect(0, gy0, cssW, cssH - gy0); ctx.clip();   // never above the horizon
    ctx.globalAlpha = 0.45; ctx.translate(0, -camY * scale % 160); ctx.fillStyle = cavePattern;
    ctx.fillRect(0, gy0 - 160, cssW, cssH - gy0 + 320); ctx.restore();
  }

  // --- terrain chunks ---
  const i0 = Math.max(0, (camY / CH_H) | 0), i1 = Math.max(0, ((camY + cssH / scale) / CH_H) | 0);
  for (let i = i0; i <= i1 + 1; i++) {
    chunk(i); paintChunk(i);
    ctx.drawImage(chunks[i].cv, 0, sY(i * CH_H), WORLD_W * scale, CH_H * scale + 0.5);
  }

  // --- water ---
  if (waterCells > 0) {
    const cy0 = Math.max(0, ((camY) / CELL | 0) - 1), cy1 = ((camY + cssH / scale) / CELL | 0) + 1;
    ctx.globalAlpha = 0.8;
    for (let cy = Math.max(cy0, wTop - 1); cy <= Math.min(cy1, wBot + 1); cy++)
      for (let cx = BANK; cx < COLS - BANK; cx++) {
        if (!wetAt(cx, cy)) continue;
        const x = sX(cx * CELL + 5), y = sY(cy * CELL + 5);
        ctx.drawImage(WATERBLOB, x - 13 * scale, y - 13 * scale, 26 * scale, 26 * scale);
        if (!wetAt(cx, cy - 1)) {
          ctx.strokeStyle = 'rgba(210,235,255,.5)'; ctx.lineWidth = 1.2;
          const w = Math.sin(time / 700 + cx * 0.8) * 1.5;
          ctx.beginPath(); ctx.moveTo(x - 5 * scale, y - 4 * scale + w); ctx.lineTo(x + 5 * scale, y - 4 * scale + w); ctx.stroke();
        }
      }
    ctx.globalAlpha = 1;
  }

  // --- flora & small things (world space via transform) ---
  ctx.save(); ctx.scale(scale, scale); ctx.translate(0, -camY);
  for (const r of roots) {
    const sw = Math.sin(time / 1100 + r.ph) * 4;
    ctx.strokeStyle = 'rgba(94,66,44,.85)'; ctx.lineWidth = r.w;
    ctx.beginPath(); ctx.moveTo(r.x, r.y);
    ctx.quadraticCurveTo(r.x + sw * 0.4, r.y + r.len * 0.6, r.x + sw, r.y + r.len);
    ctx.stroke();
    ctx.fillStyle = 'rgba(143,174,126,.8)'; ctx.beginPath(); ctx.arc(r.x + sw, r.y + r.len, 1.6, 0, 7); ctx.fill();
  }
  for (const m of mushrooms) {
    const s = m.s; if (s <= 0.05) continue;
    ctx.fillStyle = '#e8dcc2'; ctx.fillRect(m.x - 1.2 * s, m.y - 7 * s, 2.4 * s, 7 * s);
    ctx.fillStyle = m.tint < 0.5 ? '#c98a6e' : '#b9977a';
    ctx.beginPath(); ctx.ellipse(m.x, m.y - 7 * s, 5 * s, 3.4 * s, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,244,224,.6)'; ctx.beginPath(); ctx.arc(m.x - 1.5 * s, m.y - 8 * s, 0.8 * s, 0, 7); ctx.fill();
  }
  for (const p of pebbles) {
    ctx.globalAlpha = p.settled ? Math.max(0, 1 - (p.t - 6) / 3) : 1;
    ctx.fillStyle = '#7c7288'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.4, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const p of crumbs) {
    ctx.globalAlpha = Math.min(1, p.life * 1.6);
    ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // live grass sway on the rim
  const gc0 = Math.max(0, (camY / CELL) | 0);
  if (gc0 === 0 && sY(0) > -30) {
    for (let c = BANK; c < COLS - BANK; c++) {
      if (typeAt(c, 0) === TY.EMPTY) continue;
      const h = hash2(c, 77); if (h > 0.5) continue;
      const x = c * CELL + h * 8, sw = Math.sin(time / 1000 + c * 0.7) * 2.2;
      ctx.strokeStyle = 'rgba(125,152,120,.9)'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(x, 2); ctx.quadraticCurveTo(x + sw * 0.4, -4, x + sw, -9 - h * 6); ctx.stroke();
    }
  }
  // birds & butterflies
  for (const b of birds) {
    const bob = b.state === 'perch' ? Math.sin(time / 460 + b.x) * 0.7 : 0;
    ctx.fillStyle = mix('#6e5a70', '#8a6a55', b.hue);
    ctx.beginPath(); ctx.ellipse(b.x, b.y + bob, 4.4, 3.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#f0e3cf'; ctx.beginPath(); ctx.ellipse(b.x + 1, b.y + 1 + bob, 2.4, 1.8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#4a3c50'; ctx.beginPath(); ctx.arc(b.x + 3.4, b.y - 1.6 + bob, 1.7, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8a84a'; ctx.fillRect(b.x + 4.8, b.y - 1.9 + bob, 2, 1);
    if (b.state === 'fly') { const w = Math.sin(time / 60) > 0 ? -3 : 1;
      ctx.strokeStyle = '#6e5a70'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(b.x - 2, b.y); ctx.lineTo(b.x - 5, b.y + w); ctx.stroke(); }
  }
  for (const f of butterflies) {
    const y = -12 + Math.sin(f.ph * 1.3) * 9;
    const flap = Math.sin(time / 90 + f.ph) * 2.4;
    ctx.fillStyle = mix('#e8b9c8', '#f0d8a0', f.hue);
    ctx.beginPath(); ctx.ellipse(f.x - 2, y, 2.6, Math.abs(flap), 0.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(f.x + 2, y, 2.6, Math.abs(flap), -0.4, 0, 7); ctx.fill();
  }
  // lanterns
  for (const L of lanterns) {
    const sw = Math.sin(time / 1300 + L.ph) * 0.06;
    ctx.save(); ctx.translate(L.x, L.y); ctx.rotate(sw);
    ctx.strokeStyle = '#4a3826'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 9); ctx.stroke();
    ctx.fillStyle = '#5c4630'; ctx.fillRect(-3.4, 9, 6.8, 2);
    ctx.fillStyle = 'rgba(255,214,140,.92)';
    ctx.beginPath(); ctx.ellipse(0, 15.5, 4.6, 5.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#5c4630'; ctx.fillRect(-2.6, 20, 5.2, 1.6);
    ctx.restore();
  }
  ctx.restore();

  // --- soft darkness + lights ---
  const og = octx; og.setTransform(1, 0, 0, 1, 0, 0);
  og.clearRect(0, 0, oCan.width, oCan.height);
  const oScale = oCan.width / WORLD_W;
  const oy = wy => (wy - camY) * oScale;
  const dg = og.createLinearGradient(0, oy(60), 0, oy(1500));
  dg.addColorStop(0, `rgba(10,6,20,${sky.amb})`);
  dg.addColorStop(1, `rgba(10,6,20,${Math.min(0.86, sky.amb + 0.8)})`);
  og.fillStyle = dg; og.fillRect(0, Math.max(0, oy(0)), oCan.width, oCan.height);
  if (night > 0.02) { og.fillStyle = `rgba(14,12,34,${0.32 * night})`; og.fillRect(0, 0, oCan.width, Math.max(0, oy(0))); }
  og.globalCompositeOperation = 'destination-out';
  const punch = (wx, wy, r, a) => {
    const x = wx * oScale, y = oy(wy);
    const pg = og.createRadialGradient(x, y, 2, x, y, r * oScale);
    pg.addColorStop(0, `rgba(0,0,0,${a})`); pg.addColorStop(1, 'rgba(0,0,0,0)');
    og.fillStyle = pg; og.beginPath(); og.arc(x, y, r * oScale, 0, 7); og.fill();
  };
  for (const L of lanterns) punch(L.x, L.y + 15, 180, 0.92);
  for (const [, c] of crystalLights) punch(c.x, c.y, 85, 0.6);
  for (const f of fireflies) punch(f.x, f.y, 34, 0.5);
  for (const w of glowworms) punch(w.x, w.y, 26, 0.35);
  og.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(oCan, 0, 0, cssW, cssH);

  // --- glow cores above the darkness ---
  ctx.save(); ctx.scale(scale, scale); ctx.translate(0, -camY);
  for (const L of lanterns) {
    const fl = 0.85 + Math.sin(time / 90 + L.ph * 9) * 0.08;
    ctx.fillStyle = `rgba(255,232,170,${fl})`;
    ctx.beginPath(); ctx.arc(L.x, L.y + 15.5, 2.2, 0, 7); ctx.fill();
  }
  for (const [, c] of crystalLights) {
    const tw = 0.5 + 0.5 * Math.abs(Math.sin(time / 700 + c.x));
    ctx.fillStyle = `rgba(159,232,200,${0.5 + tw * 0.4})`;
    ctx.beginPath(); ctx.arc(c.x, c.y, 1.8 + tw, 0, 7); ctx.fill();
  }
  for (const f of fireflies) {
    const pu = Math.max(0, Math.sin(f.ph * 1.7));
    ctx.fillStyle = `rgba(214,255,170,${0.25 + pu * 0.7})`;
    ctx.beginPath(); ctx.arc(f.x, f.y, 1.4 + pu, 0, 7); ctx.fill();
  }
  for (const w of glowworms) {
    const pu = 0.5 + 0.5 * Math.sin(time / 1000 + w.ph);
    ctx.fillStyle = `rgba(150,230,210,${0.3 + pu * 0.5})`;
    ctx.beginPath(); ctx.arc(w.x, w.y, 1.1, 0, 7); ctx.fill();
  }
  for (const m of moths) {
    const x = m.L.x + Math.cos(m.ph) * m.r, y = m.L.y + 15 + Math.sin(m.ph * 1.3) * m.r * 0.5;
    ctx.fillStyle = 'rgba(240,230,200,.75)'; ctx.beginPath(); ctx.arc(x, y, 1.2, 0, 7); ctx.fill();
  }
  for (const s of sparkles) {
    ctx.globalAlpha = Math.min(1, s.life);
    ctx.fillStyle = `hsl(${s.hue} 70% 78%)`;
    ctx.beginPath(); ctx.arc(s.x, s.y, 1.6, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // --- cursor ring ---
  if (mouse.in) {
    const wx = mouse.x / scale, wy = mouse.y / scale + camY;
    const overBank = wx < BANK * CELL || wx > WORLD_W - BANK * CELL || wy < 0;
    ctx.strokeStyle = `rgba(243,232,212,${overBank ? 0.14 : carving ? 0.75 : 0.4})`;
    ctx.lineWidth = 1.6;
    const r = BRUSH * scale * (carving ? 0.93 : 1);
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, r, 0, 7); ctx.stroke();
    ctx.fillStyle = 'rgba(243,232,212,.5)';
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 1.6, 0, 7); ctx.fill();
  }
}

// ================= UI =======================================================
const depthEl = document.getElementById('depth');
let shownM = -1;
function refreshUI() {
  if (!depthDirty) return; depthDirty = false;
  const m = Math.floor(maxDepthPx / M);
  if (m !== shownM) {
    shownM = m;
    depthEl.textContent = m + ' m';
    depthEl.classList.toggle('show', m > 0);
  }
}
const tinyEl = document.getElementById('tiny');
function whisper(text, ms) {
  tinyEl.textContent = text; tinyEl.classList.add('show');
  clearTimeout(whisper.t); whisper.t = setTimeout(() => tinyEl.classList.remove('show'), ms || 4200);
}
document.getElementById('sound').onclick = e => {
  muted = !muted; if (masterG) masterG.gain.value = muted ? 0 : 0.5;
  e.target.textContent = muted ? 'sound off' : 'sound on';
};

// ================= input ====================================================
function placeLantern(wx, wy) {
  // hang from the nearest solid cell above/beside
  let best = null, bd = 1e9;
  for (let dy = -6; dy <= 6; dy++) for (let dx = -6; dx <= 6; dx++) {
    const cx = ((wx / CELL) | 0) + dx, cy = ((wy / CELL) | 0) + dy;
    if (cy < 0 || !isSolid(cx, cy) || !isEmpty(cx, cy + 1)) continue;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = { x: cx * CELL + 5, y: cy * CELL + 10 }; }
  }
  if (best && lanterns.length < 24) {
    lanterns.push({ x: best.x, y: best.y, ph: Math.random() * 7 });
    tone(880, 0.25, 0.03); tone(1320, 0.35, 0.02);
    if (lanterns.length === 1) whisper('a little light for the way down');
  }
}
cv.addEventListener('mousedown', e => {
  audio(); startWind(); started = true;
  document.getElementById('title').classList.add('gone');
  if (e.button === 0) carving = true;
  else if (e.button === 2) placeLantern(e.offsetX / scale, e.offsetY / scale + camY);
});
window.addEventListener('mouseup', () => carving = false);
cv.addEventListener('mousemove', e => { mouse.x = e.offsetX; mouse.y = e.offsetY; mouse.in = true; });
cv.addEventListener('mouseleave', () => { mouse.in = false; carving = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('wheel', e => { camVel += e.deltaY * 2.4; }, { passive: true });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') camVel += 260;
  if (e.key === 'ArrowUp') camVel -= 260;
});

// ================= boot =====================================================
function boot() {
  resize();
  paintChunk(0); paintChunk(1);
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt, now);
    draw(now);
    refreshUI();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  setTimeout(() => document.getElementById('title').classList.add('gone'), 12000);
  if (Math.min(window.innerWidth, window.innerHeight) < 560)
    whisper('best enjoyed on a computer, with a mouse', 6000);
}
if (document.fonts && document.fonts.ready) {
  let done = false;
  const go = () => { if (!done) { done = true; boot(); } };
  document.fonts.ready.then(go); setTimeout(go, 700);
} else boot();

// dev/test handle
window.__hole = {
  snapshot: () => ({ depthM: maxDepthPx / M, water: waterCells, wTop, wBot, lanterns: lanterns.length, roots: roots.length, springs: springs.length }),
  carve: (x, y, r) => { for (let cy = Math.max(0, ((y - r) / CELL) | 0); cy <= ((y + r) / CELL) | 0; cy++)
    for (let cx = Math.max(BANK, ((x - r) / CELL) | 0); cx <= Math.min(COLS - BANK - 1, ((x + r) / CELL) | 0); cx++) {
      const t = typeAt(cx, cy);
      if (DIGRATE[t] && Math.hypot(cx * CELL + 5 - x, cy * CELL + 5 - y) <= r) digCell(cx, cy, t, true);
    } },
  addWater: (x, y, n) => { let placed = 0;
    for (let rad = 0; rad < 14 && placed < n; rad++)
      for (let cy = ((y / CELL) | 0) - rad; cy <= ((y / CELL) | 0) + rad && placed < n; cy++)
        for (let cx = ((x / CELL) | 0) - rad; cx <= ((x / CELL) | 0) + rad && placed < n; cx++)
          if (isEmpty(cx, cy) && !wetAt(cx, cy)) { setWet(cx, cy, 1); placed++; } },
  setCycle: f => { cycOverride = f; },
  cellAt: (x, y) => typeAt((x / CELL) | 0, (y / CELL) | 0),
};
</script>
