<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Sudoku</title>
  <style>
    /* ── Reset ──────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f5f7fa;
      --surface:      #ffffff;
      --border:       #d4dae3;
      --border-box:   #4a5568;
      --text:         #1a2b4a;
      --text-muted:   #8896aa;
      --accent:       #2b5fce;
      --accent-light: #dde8ff;
      --highlight:    #dde8ff;
      --same-num:     #c4d4f5;
      --error:        #ffe5e5;
      --error-text:   #c0392b;
      --given:        #1a2b4a;
      --user:         #2b5fce;
      --note:         #5577bb;
      --shadow:       0 2px 16px rgba(0,0,0,.09);
      --radius:       12px;
    }

    [data-theme="dark"] {
      --bg:           #0f172a;
      --surface:      #1e293b;
      --border:       #334155;
      --border-box:   #64748b;
      --text:         #e2e8f0;
      --text-muted:   #64748b;
      --accent:       #60a5fa;
      --accent-light: #1e3a5f;
      --highlight:    #1e3a5f;
      --same-num:     #172d4a;
      --error:        #3b1111;
      --error-text:   #f87171;
      --given:        #e2e8f0;
      --user:         #60a5fa;
      --note:         #93c5fd;
      --shadow:       0 2px 16px rgba(0,0,0,.4);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background .3s, color .3s;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 8px;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -.5px;
    }
    .logo span { color: var(--text); }

    .header-right { display: flex; gap: 8px; align-items: center; }

    .new-game-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    .new-game-btn:hover { opacity: .88; }

    .theme-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    /* ── Wrapper ─────────────────────────────────────────────────────────── */
    .game-wrapper {
      width: 100%;
      max-width: 480px;
      padding: 0 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Difficulty bar ──────────────────────────────────────────────────── */
    .difficulty-bar {
      display: flex;
      gap: 4px;
      justify-content: center;
    }
    .diff-btn {
      padding: 5px 12px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .diff-btn.active, .diff-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Stats ───────────────────────────────────────────────────────────── */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 10px 16px;
      box-shadow: var(--shadow);
    }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .stat-label {
      font-size: .65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .stat-value { font-size: .9rem; font-weight: 700; color: var(--text); }
    #timer { font-variant-numeric: tabular-nums; }
    #errorDisplay { color: var(--error-text); }

    /* ── Board ───────────────────────────────────────────────────────────── */
    .board-outer {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 8px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows:    repeat(9, 1fr);
      border: 2px solid var(--border-box);
      border-radius: 4px;
      overflow: hidden;
      aspect-ratio: 1;
      width: 100%;
      user-select: none;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(.8rem, 3.8vw, 1.35rem);
      font-weight: 700;
      cursor: pointer;
      background: var(--surface);
      color: var(--given);
      transition: background .1s;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    /* Box borders */
    .cell:nth-child(3n):not(:nth-child(9n)) { border-right: 2px solid var(--border-box); }
    .cell[data-row="2"], .cell[data-row="5"] { border-bottom: 2px solid var(--border-box); }
    .cell[data-row="8"] { border-bottom: 2px solid var(--border-box); }
    .cell:nth-child(9n) { border-right: 2px solid var(--border-box); }

    .cell.user-filled { color: var(--user); }
    .cell.highlighted  { background: var(--highlight); }
    .cell.same-number  { background: var(--same-num); }
    .cell.selected     { background: var(--accent-light) !important; }
    .cell.error        { color: var(--error-text) !important; background: var(--error) !important; }
    .cell:hover:not(.selected) { background: var(--highlight); }

    /* Notes */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      grid-template-rows: repeat(3,1fr);
      width: 100%; height: 100%;
      padding: 1px;
    }
    .note-num {
      font-size: clamp(.38rem, 1.1vw, .52rem);
      font-weight: 500;
      color: var(--note);
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Complete banner ─────────────────────────────────────────────────── */
    .banner {
      display: none;
      text-align: center;
      padding: 14px 20px;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 1rem;
      animation: pop .4s ease;
      box-shadow: var(--shadow);
    }
    .banner.success {
      background: #e8f8ee;
      color: #1a7a3a;
      border: 2px solid #1a7a3a;
    }
    .banner.gameover {
      background: #fde8e8;
      color: #c0392b;
      border: 2px solid #c0392b;
    }
    [data-theme="dark"] .banner.success  { background: #0f2e1a; color: #4ade80; border-color: #4ade80; }
    [data-theme="dark"] .banner.gameover { background: #2e0f0f; color: #f87171; border-color: #f87171; }
    .banner.show { display: block; }
    @keyframes pop {
      0%   { transform: scale(.8); opacity: 0; }
      70%  { transform: scale(1.04); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ── Action row ──────────────────────────────────────────────────────── */
    .actions {
      display: flex;
      justify-content: space-around;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px 8px 8px;
      box-shadow: var(--shadow);
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      padding: 4px 10px;
      border-radius: 8px;
      transition: background .15s;
      position: relative;
    }
    .action-btn:hover { background: var(--highlight); }
    .action-btn .icon {
      font-size: 1.3rem;
      line-height: 1;
      position: relative;
    }
    .action-btn .lbl {
      font-size: .65rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .3px;
    }
    .badge {
      position: absolute;
      top: -6px; right: -8px;
      background: var(--accent);
      color: #fff;
      font-size: .55rem;
      font-weight: 700;
      border-radius: 10px;
      padding: 1px 5px;
      min-width: 16px;
      text-align: center;
    }
    .notes-toggle {
      position: absolute;
      top: -6px; right: -14px;
      background: var(--text-muted);
      color: #fff;
      font-size: .5rem;
      font-weight: 700;
      border-radius: 4px;
      padding: 1px 4px;
    }
    .notes-toggle.on { background: var(--accent); }

    /* ── Numpad ──────────────────────────────────────────────────────────── */
    .numpad {
      display: flex;
      justify-content: space-between;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 12px 6px;
      box-shadow: var(--shadow);
      gap: 2px;
    }
    .num-btn {
      flex: 1;
      aspect-ratio: .75;
      background: none;
      border: none;
      color: var(--accent);
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      font-weight: 800;
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .12s;
      position: relative;
    }
    .num-btn:hover { background: var(--highlight); }
    .num-btn:active { transform: scale(.92); }
    .num-btn.done { opacity: .25; pointer-events: none; }
  </style>
</head>
<body>

<header>
  <div class="logo">su<span>doku</span></div>
  <div class="header-right">
    <button class="theme-btn" id="themeBtn">🌙</button>
    <button class="new-game-btn" id="newGameBtn">Nowa gra</button>
  </div>
</header>

<div class="game-wrapper">

  <!-- Difficulty -->
  <div class="difficulty-bar">
    <button class="diff-btn active" data-diff="easy">Łatwy</button>
    <button class="diff-btn" data-diff="medium">Średni</button>
    <button class="diff-btn" data-diff="hard">Trudny</button>
    <button class="diff-btn" data-diff="expert">Ekspert</button>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-label">Trudność</span>
      <span class="stat-value" id="diffLabel">Łatwy</span>
    </div>
    <div class="stat">
      <span class="stat-label">Błędy</span>
      <span class="stat-value" id="errorDisplay">0/3</span>
    </div>
    <div class="stat">
      <span class="stat-label">Czas</span>
      <span class="stat-value" id="timer">00:00</span>
    </div>
    <div class="stat">
      <span class="stat-label">Wskazówki</span>
      <span class="stat-value" id="hintStat">0</span>
    </div>
  </div>

  <!-- Board -->
  <div class="board-outer">
    <div id="board"></div>
  </div>

  <!-- Banner -->
  <div class="banner" id="banner"></div>

  <!-- Actions -->
  <div class="actions">
    <button class="action-btn" id="undoBtn">
      <span class="icon">↩</span>
      <span class="lbl">Cofnij</span>
    </button>
    <button class="action-btn" id="eraseBtn">
      <span class="icon">⌫</span>
      <span class="lbl">Wymaż</span>
    </button>
    <button class="action-btn" id="notesBtn">
      <span class="icon">✏️<span class="notes-toggle" id="notesToggle">OFF</span></span>
      <span class="lbl">Notatki</span>
    </button>
    <button class="action-btn" id="hintBtn">
      <span class="icon">💡<span class="badge" id="hintBadge">3</span></span>
      <span class="lbl">Wskazówka</span>
    </button>
  </div>

  <!-- Numpad -->
  <div class="numpad" id="numpad"></div>

</div>

<script>
/* ═══════════════════  SUDOKU ENGINE  ═══════════════════════════════════════ */

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.random() * (i+1) | 0;
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function fillGrid(g = new Array(81).fill(0)) {
  const idx = g.indexOf(0);
  if (idx === -1) return g;
  const r = idx/9|0, c = idx%9;
  for (const n of shuffle([1,2,3,4,5,6,7,8,9])) {
    if (valid(g,r,c,n)) {
      g[idx] = n;
      if (fillGrid(g)) return g;
      g[idx] = 0;
    }
  }
  return null;
}

function valid(g,r,c,n) {
  for (let i=0;i<9;i++) {
    if (g[r*9+i]===n || g[i*9+c]===n) return false;
  }
  const br=r/3|0, bc=c/3|0;
  for (let i=br*3;i<br*3+3;i++)
    for (let j=bc*3;j<bc*3+3;j++)
      if (g[i*9+j]===n) return false;
  return true;
}

function countSol(g, lim=2) {
  const idx = g.indexOf(0);
  if (idx===-1) return 1;
  const r=idx/9|0, c=idx%9;
  let cnt=0;
  for (let n=1;n<=9;n++) {
    if (valid(g,r,c,n)) {
      g[idx]=n; cnt+=countSol(g,lim); g[idx]=0;
      if (cnt>=lim) return cnt;
    }
  }
  return cnt;
}

const REMOVE = {easy:36, medium:46, hard:52, expert:58};

function makePuzzle(diff='easy') {
  const sol = fillGrid();
  const puz = [...sol];
  let rm=0;
  for (const idx of shuffle([...Array(81).keys()])) {
    if (rm >= REMOVE[diff]) break;
    const bak=puz[idx]; puz[idx]=0;
    if (countSol([...puz])===1) rm++;
    else puz[idx]=bak;
  }
  return {puzzle:puz, solution:sol};
}

/* ═══════════════════  STATE  ════════════════════════════════════════════════ */

const DIFF_LABELS = {easy:'Łatwy', medium:'Średni', hard:'Trudny', expert:'Ekspert'};
const MAX_ERRORS = 3;
const MAX_HINTS  = 3;

const S = {
  puzzle:null, solution:null, board:null, notes:null, given:null,
  sel:-1, notesMode:false, errors:0, hints:MAX_HINTS,
  history:[], timerSecs:0, timerInt:null,
  diff:'easy', done:false, gameOver:false,
};

/* ═══════════════════  DOM REFS  ═════════════════════════════════════════════ */

const boardEl     = document.getElementById('board');
const numpadEl    = document.getElementById('numpad');
const timerEl     = document.getElementById('timer');
const errorEl     = document.getElementById('errorDisplay');
const hintStatEl  = document.getElementById('hintStat');
const diffLabelEl = document.getElementById('diffLabel');
const bannerEl    = document.getElementById('banner');
const themeBtn    = document.getElementById('themeBtn');
const newGameBtn  = document.getElementById('newGameBtn');
const undoBtn     = document.getElementById('undoBtn');
const eraseBtn    = document.getElementById('eraseBtn');
const notesBtn    = document.getElementById('notesBtn');
const hintBtn     = document.getElementById('hintBtn');
const notesToggle = document.getElementById('notesToggle');
const hintBadge   = document.getElementById('hintBadge');

/* ═══════════════════  THEME  ════════════════════════════════════════════════ */

let dark = localStorage.getItem('sudoku-theme') === 'dark';
applyTheme();
function applyTheme() {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  themeBtn.textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('sudoku-theme', dark ? 'dark' : 'light');
}
themeBtn.addEventListener('click', () => { dark=!dark; applyTheme(); });

/* ═══════════════════  DIFFICULTY  ══════════════════════════════════════════ */

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    S.diff = btn.dataset.diff;
    startGame();
  });
});

/* ═══════════════════  GAME INIT  ════════════════════════════════════════════ */

newGameBtn.addEventListener('click', startGame);

function startGame() {
  clearInterval(S.timerInt);
  bannerEl.classList.remove('show');

  const {puzzle,solution} = makePuzzle(S.diff);
  S.puzzle   = puzzle;
  S.solution = solution;
  S.board    = [...puzzle];
  S.notes    = Array.from({length:81}, ()=>new Set());
  S.given    = puzzle.map(v=>v!==0);
  S.sel      = -1;
  S.notesMode= false;
  S.errors   = 0;
  S.hints    = MAX_HINTS;
  S.history  = [];
  S.timerSecs= 0;
  S.done     = false;
  S.gameOver = false;

  notesToggle.textContent = 'OFF';
  notesToggle.classList.remove('on');
  diffLabelEl.textContent = DIFF_LABELS[S.diff];
  errorEl.textContent = `0/${MAX_ERRORS}`;
  hintStatEl.textContent = '0';
  hintBadge.textContent  = MAX_HINTS;
  hintBtn.style.opacity  = '1';
  hintBtn.style.pointerEvents = '';

  renderBoard();
  buildNumpad();
  startTimer();
}

/* ═══════════════════  TIMER  ════════════════════════════════════════════════ */

function startTimer() {
  timerEl.textContent = '00:00';
  S.timerInt = setInterval(() => {
    if (S.done || S.gameOver) return;
    S.timerSecs++;
    const m = String(S.timerSecs/60|0).padStart(2,'0');
    const s = String(S.timerSecs%60).padStart(2,'0');
    timerEl.textContent = `${m}:${s}`;
  }, 1000);
}

/* ═══════════════════  BOARD RENDER  ═════════════════════════════════════════ */

function renderBoard() {
  boardEl.innerHTML = '';
  for (let i=0;i<81;i++) {
    const el = document.createElement('div');
    el.className = 'cell';
    el.dataset.idx = i;
    el.dataset.row = i/9|0;
    el.dataset.col = i%9;
    el.addEventListener('click', ()=>selectCell(i));
    boardEl.appendChild(el);
  }
  for (let i=0;i<81;i++) refreshCell(i);
  highlight();
}

function refreshCell(i) {
  const el = boardEl.children[i];
  if (!el) return;
  // preserve state classes, rebuild content
  el.className = 'cell';
  if (S.given[i]) el.classList.add('given');

  const v = S.board[i];
  if (v !== 0) {
    const wrong = !S.given[i] && v !== S.solution[i];
    if (wrong) el.classList.add('error');
    else if (!S.given[i]) el.classList.add('user-filled');
    el.textContent = v;
  } else if (S.notes[i].size > 0) {
    el.textContent = '';
    const grid = document.createElement('div');
    grid.className = 'notes-grid';
    for (let n=1;n<=9;n++) {
      const span = document.createElement('span');
      span.className = 'note-num';
      span.textContent = S.notes[i].has(n) ? n : '';
      grid.appendChild(span);
    }
    el.appendChild(grid);
  } else {
    el.textContent = '';
  }
}

function highlight() {
  const sel = S.sel;
  const selV = sel>=0 ? S.board[sel] : 0;
  const selR = sel>=0 ? sel/9|0 : -1;
  const selC = sel>=0 ? sel%9 : -1;
  const selB = sel>=0 ? (selR/3|0)*3+(selC/3|0) : -1;

  for (let i=0;i<81;i++) {
    const el = boardEl.children[i];
    if (!el) continue;
    el.classList.remove('selected','highlighted','same-number');
    if (i===sel) { el.classList.add('selected'); continue; }
    if (sel<0) continue;
    const r=i/9|0, c=i%9, b=(r/3|0)*3+(c/3|0);
    if (r===selR||c===selC||b===selB) el.classList.add('highlighted');
    if (selV!==0 && S.board[i]===selV) el.classList.add('same-number');
  }
}

/* ═══════════════════  SELECT  ═══════════════════════════════════════════════ */

function selectCell(i) {
  S.sel = i;
  highlight();
}

/* ═══════════════════  NUMPAD  ═══════════════════════════════════════════════ */

function buildNumpad() {
  numpadEl.innerHTML = '';
  const counts = new Array(10).fill(0);
  for (let i=0;i<81;i++)
    if (S.board[i]>0 && S.board[i]===S.solution[i]) counts[S.board[i]]++;

  for (let n=1;n<=9;n++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    if (counts[n]>=9) btn.classList.add('done');
    btn.textContent = n;
    btn.addEventListener('click', ()=>inputNum(n));
    numpadEl.appendChild(btn);
  }
}

/* ═══════════════════  INPUT  ════════════════════════════════════════════════ */

function inputNum(n) {
  const i = S.sel;
  if (i<0 || S.given[i] || S.done || S.gameOver) return;

  if (S.notesMode) {
    saveHistory(i);
    S.notes[i].has(n) ? S.notes[i].delete(n) : S.notes[i].add(n);
    refreshCell(i);
    return;
  }

  if (S.board[i]===n) return;
  saveHistory(i);
  S.notes[i].clear();
  S.board[i] = n;

  if (n !== S.solution[i]) {
    S.errors++;
    errorEl.textContent = `${S.errors}/${MAX_ERRORS}`;
    if (S.errors >= MAX_ERRORS) {
      endGame(false);
      refreshCell(i);
      highlight();
      return;
    }
  } else {
    clearRelatedNotes(i, n);
  }

  refreshCell(i);
  highlight();
  buildNumpad();
  checkWin();
}

function clearRelatedNotes(idx, n) {
  const r=idx/9|0, c=idx%9, br=(r/3|0)*3, bc=(c/3|0)*3;
  for (let i=0;i<81;i++) {
    const ri=i/9|0, ci=i%9;
    if (ri===r||ci===c||(ri/3|0)*3===br&&(ci/3|0)*3===bc) {
      if (S.notes[i].has(n)) { S.notes[i].delete(n); refreshCell(i); }
    }
  }
}

/* ═══════════════════  ERASE  ════════════════════════════════════════════════ */

eraseBtn.addEventListener('click', ()=>{
  const i=S.sel;
  if (i<0||S.given[i]||S.done||S.gameOver) return;
  if (S.board[i]===0&&S.notes[i].size===0) return;
  saveHistory(i);
  S.board[i]=0; S.notes[i].clear();
  refreshCell(i); highlight(); buildNumpad();
});

/* ═══════════════════  NOTES  ════════════════════════════════════════════════ */

notesBtn.addEventListener('click', ()=>{
  S.notesMode = !S.notesMode;
  notesToggle.textContent = S.notesMode ? 'ON' : 'OFF';
  notesToggle.classList.toggle('on', S.notesMode);
});

/* ═══════════════════  HINT  ═════════════════════════════════════════════════ */

hintBtn.addEventListener('click', ()=>{
  if (S.done||S.gameOver||S.hints<=0) return;
  let target = S.sel>=0&&S.board[S.sel]===0&&!S.given[S.sel] ? S.sel : -1;
  if (target<0) {
    const emp=[];
    for (let i=0;i<81;i++) if (S.board[i]===0) emp.push(i);
    if (!emp.length) return;
    target = emp[Math.random()*emp.length|0];
  }
  saveHistory(target);
  S.notes[target].clear();
  S.board[target]=S.solution[target];
  S.given[target]=true;
  S.hints--;
  hintStatEl.textContent = MAX_HINTS - S.hints;
  hintBadge.textContent  = S.hints;
  if (S.hints<=0) { hintBtn.style.opacity='.3'; hintBtn.style.pointerEvents='none'; }

  clearRelatedNotes(target, S.solution[target]);
  selectCell(target);
  refreshCell(target);
  highlight();
  buildNumpad();
  checkWin();
});

/* ═══════════════════  UNDO  ═════════════════════════════════════════════════ */

function saveHistory(idx) {
  S.history.push({idx, val:S.board[idx], notes:new Set(S.notes[idx])});
  if (S.history.length>100) S.history.shift();
}

undoBtn.addEventListener('click', ()=>{
  if (!S.history.length||S.done||S.gameOver) return;
  const {idx,val,notes}=S.history.pop();
  S.board[idx]=val; S.notes[idx]=notes;
  S.sel=idx;
  refreshCell(idx); highlight(); buildNumpad();
});

/* ═══════════════════  KEYBOARD  ═════════════════════════════════════════════ */

document.addEventListener('keydown', e=>{
  if (S.done||S.gameOver) return;
  const arrows = {ArrowUp:-9, ArrowDown:9, ArrowLeft:-1, ArrowRight:1};
  if (arrows[e.key] !== undefined) {
    e.preventDefault();
    const cur = S.sel<0 ? 0 : S.sel;
    const next = Math.max(0,Math.min(80,cur+arrows[e.key]));
    selectCell(next); return;
  }
  if (e.key==='n'||e.key==='N') { notesBtn.click(); return; }
  if ((e.ctrlKey||e.metaKey)&&e.key==='z') { undoBtn.click(); return; }
  if (e.key==='Delete'||e.key==='Backspace') { eraseBtn.click(); return; }
  const n=+e.key;
  if (n>=1&&n<=9) inputNum(n);
});

/* ═══════════════════  WIN / LOSE  ═══════════════════════════════════════════ */

function checkWin() {
  for (let i=0;i<81;i++) if (S.board[i]!==S.solution[i]) return;
  endGame(true);
}

function endGame(win) {
  if (win) {
    S.done = true;
    clearInterval(S.timerInt);
    bannerEl.className = 'banner success show';
    const m=String(S.timerSecs/60|0).padStart(2,'0');
    const s=String(S.timerSecs%60).padStart(2,'0');
    bannerEl.textContent = `🎉 Brawo! Ukończyłeś w ${m}:${s}!`;
  } else {
    S.gameOver = true;
    clearInterval(S.timerInt);
    bannerEl.className = 'banner gameover show';
    bannerEl.textContent = '❌ Koniec gry — przekroczono limit błędów!';
  }
}

/* ═══════════════════  START  ════════════════════════════════════════════════ */

startGame();
</script>
