name: Deploy Sudoku to GitHub Pages

on:
  push:
    branches:
      - master
      - claude/sudoku-app-5q5fhc
    paths:
      - "sudoku/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: sudoku
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
